<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics 2 Study Bot — Exam 2</title>
  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #23263a;
      --border: #2e3250;
      --accent: #6c7aff;
      --accent2: #a78bfa;
      --green: #34d399;
      --red: #f87171;
      --yellow: #fbbf24;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    /* ── LAYOUT ── */
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky; top: 0; z-index: 100;
    }
    header h1 { font-size: 1rem; font-weight: 600; color: var(--accent); }
    header h1 span { color: var(--text-dim); font-weight: 400; }
    main { flex: 1; padding: 32px 24px; max-width: 800px; margin: 0 auto; width: 100%; }

    /* ── NAV TABS ── */
    .nav-tabs {
      display: flex; gap: 4px;
      background: var(--surface2);
      border-radius: 10px; padding: 4px;
    }
    .nav-tab {
      flex: 1; padding: 8px 12px; border: none; border-radius: 8px;
      background: transparent; color: var(--text-dim);
      cursor: pointer; font-size: 0.85rem; font-weight: 500;
      transition: all 0.15s;
    }
    .nav-tab:hover { color: var(--text); background: var(--surface); }
    .nav-tab.active { background: var(--accent); color: #fff; }

    /* ── CARDS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }
    .card + .card { margin-top: 16px; }
    .card-label {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
    }
    .card h2 { font-size: 1.4rem; margin-bottom: 12px; }
    .card p { color: var(--text-dim); margin-bottom: 10px; }
    .card p:last-child { margin-bottom: 0; }

    /* ── PROGRESS BAR ── */
    .progress-wrap { margin-bottom: 24px; }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 0.8rem; color: var(--text-dim); margin-bottom: 6px;
    }
    .progress-bar {
      height: 6px; background: var(--surface2);
      border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px; transition: width 0.3s ease;
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 8px; border: none;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-secondary {
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-success { background: var(--green); color: #0f2a1e; }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }

    /* ── FORMULA BOX ── */
    .formula {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      margin: 12px 0;
      color: var(--accent2);
    }

    /* ── ANALOGY BOX ── */
    .analogy {
      background: var(--surface2);
      border-radius: 8px; padding: 14px 16px;
      border-left: 3px solid var(--yellow);
      margin: 12px 0;
    }
    .analogy-label {
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--yellow); margin-bottom: 4px;
    }

    /* ── ANSWER CHOICES ── */
    .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .choice {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      color: var(--text);
      font-size: 0.95rem;
    }
    .choice:hover { border-color: var(--accent); }
    .choice.correct { border-color: var(--green); background: rgba(52,211,153,0.1); color: var(--green); }
    .choice.wrong { border-color: var(--red); background: rgba(248,113,113,0.1); color: var(--red); }
    .choice.reveal-correct { border-color: var(--green); background: rgba(52,211,153,0.08); }
    .choice:disabled, .choice.locked { pointer-events: none; }

    /* ── EXPLANATION BOX ── */
    .explanation {
      background: var(--surface2);
      border-radius: 8px; padding: 14px 16px;
      border-left: 3px solid var(--green);
      margin-top: 16px; display: none;
    }
    .explanation.wrong-exp { border-left-color: var(--red); }
    .explanation.show { display: block; }
    .explanation-label {
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--green); margin-bottom: 6px;
    }
    .explanation.wrong-exp .explanation-label { color: var(--red); }

    /* ── SCORE BADGE ── */
    .score-badge {
      display: inline-flex; flex-direction: column; align-items: center;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 32px;
      margin: 16px 0;
    }
    .score-num {
      font-size: 3rem; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .score-label { font-size: 0.85rem; color: var(--text-dim); margin-top: 4px; }

    /* ── TOPIC PILL ── */
    .topic-pill {
      display: inline-block;
      padding: 2px 10px; border-radius: 99px;
      font-size: 0.75rem; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-dim); margin-bottom: 12px;
    }

    /* ── FORMULA SHEET SIDEBAR ── */
    .exam-layout { display: flex; gap: 20px; align-items: flex-start; }
    .exam-main { flex: 1; min-width: 0; }
    .formula-sheet {
      width: 240px; flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      position: sticky; top: 76px;
    }
    .formula-sheet h3 {
      font-size: 0.8rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--accent); margin-bottom: 12px;
    }
    .formula-sheet .f {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem; color: var(--accent2);
      line-height: 1.8;
    }
    .formula-sheet hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

    /* ── HOME SCREEN ── */
    .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
    .home-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .home-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .home-card-icon { font-size: 2rem; margin-bottom: 12px; }
    .home-card h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .home-card p { font-size: 0.85rem; color: var(--text-dim); }
    .home-card .badge {
      display: inline-block; margin-top: 12px;
      background: var(--surface2); border-radius: 99px;
      padding: 2px 10px; font-size: 0.75rem; color: var(--accent);
    }

    /* ── STATUS INDICATOR ── */
    .weak-indicator {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.78rem; color: var(--yellow);
      background: rgba(251,191,36,0.1); border-radius: 99px;
      padding: 3px 10px; margin-left: 8px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .home-grid { grid-template-columns: 1fr; }
      .exam-layout { flex-direction: column; }
      .formula-sheet { width: 100%; position: static; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>⚡ Physics 2 Study Bot <span>— Exam 2: Ch 20 + 21</span></h1>
      <div class="nav-tabs" id="nav">
        <button class="nav-tab active" onclick="goHome()">Home</button>
        <button class="nav-tab" onclick="goMode('learn')">Learn</button>
        <button class="nav-tab" onclick="goMode('formulas')">Formulas</button>
        <button class="nav-tab" onclick="goMode('practice')">Practice</button>
        <button class="nav-tab" onclick="goMode('exam')">Mock Exam</button>
      </div>
    </header>
    <main id="main"></main>
  </div>
  <script>
    // ── STATE ──
    const state = {
      mode: 'home',
      learnIndex: 0,
      formulaIndex: 0,
      practiceIndex: 0,
      practiceAnswered: false,
      practiceQueue: [],
      weakTopics: {},
      examQuestions: [],
      examIndex: 0,
      examAnswers: [],
      examAnswered: false,
      examStartTime: 0,
      examTimeLimit: 25 * 60, // 25 minutes in seconds
    };

    // Load weak topics from localStorage
    try {
      const saved = localStorage.getItem('physicsBot_weakTopics');
      if (saved) state.weakTopics = JSON.parse(saved);
    } catch(e) {}

    // ── CONCEPTS (water-pipe analogies, no formulas until concept is established) ──
    const CONCEPTS = [
      {
        title: "Electric Current",
        topic: "current",
        waterAnalogy: "Think of electric current like water flowing through pipes. Current is the rate at which water (charge) flows past a point — measured in amperes (amps), like gallons per minute.",
        explanation: "Electric current is the flow of electric charge through a conductor. It's caused by the movement of electrons through a wire. Current flows from positive to negative (convention), though electrons actually flow the opposite direction.",
        keyPoints: [
          "Current (I) is measured in Amperes (A)",
          "1 Ampere = 1 Coulomb of charge per second",
          "Current flows from higher potential to lower potential"
        ]
      },
      {
        title: "Voltage (Potential Difference)",
        topic: "voltage",
        waterAnalogy: "Voltage is like water pressure in a pipe. Higher pressure pushes more water through. A battery creates 'pressure' that pushes charges through a circuit.",
        explanation: "Voltage (V) is the electric potential difference between two points. It represents the 'push' that drives current through a circuit. Voltage is measured in Volts (V).",
        keyPoints: [
          "Voltage is measured in Volts (V)",
          "A battery provides a fixed voltage (like 9V or 12V)",
          "Voltage causes current to flow in a circuit"
        ]
      },
      {
        title: "Resistance",
        topic: "resistance",
        waterAnalogy: "Resistance is like the narrowness of a pipe. A narrow pipe restricts water flow — more resistance means less current for the same pressure (voltage).",
        explanation: "Resistance (R) is a measure of how much a material opposes the flow of electric current. Different materials have different resistances. Resistance is measured in Ohms (Ω).",
        keyPoints: [
          "Resistance is measured in Ohms (Ω)",
          "Longer wires = more resistance",
          "Thinner wires = more resistance",
          "Higher resistivity materials = more resistance"
        ]
      },
      {
        title: "Resistors in Series",
        topic: "series",
        waterAnalogy: "Series resistors are like pipes connected end-to-end in a single line. The water must pass through each one. The total restriction is the sum of all individual restrictions.",
        explanation: "When resistors are connected in series, they form a single path for current. The same current flows through each resistor. The total (equivalent) resistance is simply the sum of individual resistances.",
        formula: "R_total = R₁ + R₂ + R₃ + ...",
        keyPoints: [
          "Same current through each resistor",
          "Voltages add up across each resistor",
          "Total resistance = sum of individual resistances",
          "Adding resistors in series always increases total resistance"
        ]
      },
      {
        title: "Resistors in Parallel",
        topic: "parallel",
        waterAnalogy: "Parallel resistors are like multiple pipes branching off from the main line. Water has multiple paths to take. Each path adds more total flow capacity, reducing the overall restriction.",
        explanation: "When resistors are connected in parallel, they provide separate paths for current. Each resistor experiences the same voltage. The total resistance decreases as more parallel paths are added.",
        formula: "1/R_total = 1/R₁ + 1/R₂ + 1/R₃ + ...",
        keyPoints: [
          "Same voltage across each parallel branch",
          "Currents add up at junction points",
          "Total resistance is less than the smallest individual resistor",
          "Adding more parallel paths decreases total resistance"
        ]
      },
      {
        title: "Kirchhoff's Junction Rule",
        topic: "kirchhoff-junction",
        waterAnalogy: "At a pipe junction, all water flowing in must flow out — you can't lose or gain water. The total in equals total out.",
        explanation: "Kirchhoff's Junction Rule (Current Law) states that the total current entering a junction must equal the total current leaving the junction. This is based on conservation of charge.",
        formula: "Σ I_in = Σ I_out",
        keyPoints: [
          "Also called Kirchhoff's Current Law (KCL)",
          "Based on conservation of electric charge",
          "Charge cannot accumulate at a junction",
          "Example: If 3A enters and two branches exit, I₁ + I₂ = 3A"
        ]
      },
      {
        title: "Kirchhoff's Loop Rule",
        topic: "kirchhoff-loop",
        waterAnalogy: "Going around a closed loop of pipes, any gain in pressure (from a pump) must be used up by restrictions (resistors). The net change in pressure around any closed loop is zero.",
        explanation: "Kirchhoff's Loop Rule (Voltage Law) states that the sum of all potential differences around any closed circuit loop must equal zero. This is based on conservation of energy.",
        formula: "Σ V = 0 (around any closed loop)",
        keyPoints: [
          "Also called Kirchhoff's Voltage Law (KVL)",
          "Based on conservation of energy",
          "Voltage rises = voltage drops in a loop",
          "Use this to analyze complex circuits"
        ]
      },
      {
        title: "Electromotive Force (emf)",
        topic: "emf",
        waterAnalogy: "A battery is like a water pump — it creates the 'pressure' (voltage) that pushes charges around the circuit. The maximum pressure the pump can create is called its electromotive force.",
        explanation: "Electromotive force (emf, symbol ε) is the maximum potential difference a battery can provide. It's measured in Volts but isn't actually a 'force' — it's the energy per unit charge provided by the battery.",
        keyPoints: [
          "emf is measured in Volts (V)",
          "A 9V battery provides 9V emf",
          "Terminal voltage is usually less than emf due to internal resistance",
          "The term 'electromotive force' is historical — it's a voltage"
        ]
      },
      {
        title: "Internal Resistance",
        topic: "internal-resistance",
        waterAnalogy: "Even the best water pump has some internal friction — it takes some of the pump's effort just to keep the pump itself working. This 'uses up' some of the pressure before it reaches the pipes.",
        explanation: "Batteries and generators have internal resistance (r), which reduces the actual voltage (terminal voltage) when current flows. The terminal voltage is less than the emf by the amount Ir.",
        formula: "V_terminal = ε - Ir",
        keyPoints: [
          "Real batteries aren't ideal — they have internal resistance",
          "Terminal voltage drops when current increases",
          "The voltage lost internally = I × r",
          "Important for high-current applications"
        ]
      },
      {
        title: "Ammeters and Voltmeters",
        topic: "meters",
        waterAnalogy: "An ammeter is like a flow meter placed IN the pipe — it must let all the water pass through it. A voltmeter is like a pressure gauge attached to the pipe — it measures pressure difference between two points without affecting flow.",
        explanation: "Ammeters measure current and must be connected in series (so current passes through them). They should have very low resistance. Voltmeters measure voltage and are connected in parallel across components. They should have very high resistance.",
        keyPoints: [
          "Ammeter: connects IN SERIES, measures current",
          "Voltmeter: connects IN PARALLEL, measures voltage",
          "Ideal ammeter: zero resistance (doesn't affect circuit)",
          "Ideal voltmeter: infinite resistance (doesn't draw current)"
        ]
      },
      {
        title: "Capacitors",
        topic: "capacitors",
        waterAnalogy: "A capacitor is like a balloon attached to a pipe — it can stretch and store water (charge) under pressure, then release it back when the pressure drops. It stores energy in an electric field.",
        explanation: "A capacitor is a device that stores electric charge and energy in an electric field. It consists of two conducting plates separated by an insulator (dielectric). Capacitance (C) measures how much charge a capacitor stores per unit voltage.",
        formula: "C = Q/V (Capacitance = Charge / Voltage)",
        keyPoints: [
          "Capacitance measured in Farads (F), usually µF or pF",
          "Capacitors store energy in an electric field",
          "Voltage across capacitor cannot change instantly",
          "Capacitors block DC current after fully charged"
        ]
      },
      {
        title: "RC Circuits - Charging",
        topic: "rc-charging",
        waterAnalogy: "Filling a capacitor with charge is like filling a balloon — at first it's easy (lots of current), but as it fills up, it gets harder for more water to fit in. The flow slows down until it stops.",
        explanation: "When a capacitor charges through a resistor, the current starts high and decreases exponentially. The voltage across the capacitor rises exponentially toward the applied voltage. The time constant τ = RC determines how fast this happens.",
        formula: "V(t) = ε(1 - e^(-t/RC))",
        keyPoints: [
          "Time constant τ = RC (in seconds)",
          "At t = τ, capacitor reaches 63.2% of final voltage",
          "After 5τ, practically fully charged (>99%)",
          "Current is maximum at start, decreases to zero"
        ]
      },
      {
        title: "RC Circuits - Discharging",
        topic: "rc-discharging",
        waterAnalogy: "A discharging capacitor is like a balloon releasing air — at first it empties quickly, then slower as the pressure (voltage) drops. The flow slows exponentially.",
        explanation: "When a charged capacitor discharges through a resistor, both the current and voltage decrease exponentially. The energy stored in the capacitor is dissipated as heat in the resistor.",
        formula: "V(t) = V₀ × e^(-t/RC)",
        keyPoints: [
          "At t = τ, capacitor voltage drops to 36.8% of initial",
          "After 5τ, practically fully discharged (<1%)",
          "Current direction reverses during discharge",
          "All initial energy eventually becomes thermal energy"
        ]
      },
      {
        title: "Complex Circuit Analysis",
        topic: "complex-circuits",
        waterAnalogy: "A complex circuit with series and parallel parts is like a plumbing system with some pipes in series and some branching in parallel. Solve it step by step: find the equivalent resistance of each section.",
        explanation: "Complex circuits combine series and parallel arrangements. The strategy is to identify sections, simplify them step by step, find equivalent resistances, then work backward to find individual voltages and currents.",
        keyPoints: [
          "Find resistors in simplest parallel/series groups",
          "Replace each group with equivalent resistance",
          "Work from complex to simple, then back",
          "Use Ohm's Law, Kirchhoff's rules as needed"
        ]
      }
    ];

    // ── FORMULAS ──
    const FORMULAS = [
      {
        name: "Ohm's Law",
        formula: "V = IR",
        variables: [
          { symbol: "V", meaning: "Voltage (potential difference)", unit: "Volts (V)" },
          { symbol: "I", meaning: "Electric current", unit: "Amperes (A)" },
          { symbol: "R", meaning: "Resistance", unit: "Ohms (Ω)" }
        ],
        topic: "resistance"
      },
      {
        name: "Resistance of a Wire",
        formula: "R = ρL/A",
        variables: [
          { symbol: "R", meaning: "Resistance", unit: "Ohms (Ω)" },
          { symbol: "ρ", meaning: "Resistivity of material", unit: "Ω·m" },
          { symbol: "L", meaning: "Length of wire", unit: "meters (m)" },
          { symbol: "A", meaning: "Cross-sectional area", unit: "m²" }
        ],
        topic: "resistance"
      },
      {
        name: "Series Resistance",
        formula: "R_total = R₁ + R₂ + R₃",
        variables: [
          { symbol: "R_total", meaning: "Equivalent total resistance", unit: "Ohms (Ω)" },
          { symbol: "R₁, R₂, R₃", meaning: "Individual resistances in series", unit: "Ohms (Ω)" }
        ],
        topic: "series"
      },
      {
        name: "Parallel Resistance (Two)",
        formula: "R_total = (R₁R₂)/(R₁+R₂)",
        variables: [
          { symbol: "R_total", meaning: "Equivalent total resistance", unit: "Ohms (Ω)" },
          { symbol: "R₁, R₂", meaning: "Individual resistances in parallel", unit: "Ohms (Ω)" }
        ],
        topic: "parallel"
      },
      {
        name: "Parallel Resistance (General)",
        formula: "1/R_total = 1/R₁ + 1/R₂ + 1/R₃",
        variables: [
          { symbol: "R_total", meaning: "Equivalent total resistance", unit: "Ohms (Ω)" },
          { symbol: "R₁, R₂, R₃", meaning: "Individual resistances in parallel", unit: "Ohms (Ω)" }
        ],
        topic: "parallel"
      },
      {
        name: "Power in Circuit",
        formula: "P = IV = I²R = V²/R",
        variables: [
          { symbol: "P", meaning: "Electrical power", unit: "Watts (W)" },
          { symbol: "I", meaning: "Current", unit: "Amperes (A)" },
          { symbol: "V", meaning: "Voltage", unit: "Volts (V)" },
          { symbol: "R", meaning: "Resistance", unit: "Ohms (Ω)" }
        ],
        topic: "power"
      },
      {
        name: "Junction Rule",
        formula: "Σ I_in = Σ I_out",
        variables: [
          { symbol: "Σ I_in", meaning: "Sum of currents entering junction", unit: "Amperes (A)" },
          { symbol: "Σ I_out", meaning: "Sum of currents leaving junction", unit: "Amperes (A)" }
        ],
        topic: "kirchhoff-junction"
      },
      {
        name: "Loop Rule",
        formula: "Σ V = 0",
        variables: [
          { symbol: "Σ V", meaning: "Sum of all voltage changes around closed loop", unit: "Volts (V)" }
        ],
        topic: "kirchhoff-loop"
      },
      {
        name: "Terminal Voltage",
        formula: "V = ε - Ir",
        variables: [
          { symbol: "V", meaning: "Terminal voltage (actual output)", unit: "Volts (V)" },
          { symbol: "ε", meaning: "Electromotive force (battery emf)", unit: "Volts (V)" },
          { symbol: "I", meaning: "Current flowing", unit: "Amperes (A)" },
          { symbol: "r", meaning: "Internal resistance", unit: "Ohms (Ω)" }
        ],
        topic: "internal-resistance"
      },
      {
        name: "Capacitor Charging Voltage",
        formula: "V = ε(1 - e^(-t/RC))",
        variables: [
          { symbol: "V", meaning: "Voltage across capacitor at time t", unit: "Volts (V)" },
          { symbol: "ε", meaning: "Applied emf (source voltage)", unit: "Volts (V)" },
          { symbol: "t", meaning: "Time since charging started", unit: "seconds (s)" },
          { symbol: "R", meaning: "Series resistance", unit: "Ohms (Ω)" },
          { symbol: "C", meaning: "Capacitance", unit: "Farads (F)" }
        ],
        topic: "rc-charging"
      },
      {
        name: "RC Time Constant",
        formula: "τ = RC",
        variables: [
          { symbol: "τ", meaning: "Time constant (tau)", unit: "seconds (s)" },

    // Shuffle array
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function goMode(mode) {
      state.mode = mode;
      if (mode === 'learn') { state.learnIndex = 0; renderLearn(); }
      else if (mode === 'formulas') { state.formulaIndex = 0; renderFormulas(); }
      else if (mode === 'practice') { startPractice(); }
      else if (mode === 'exam') { startExam(); }
      setActiveTab(['home','learn','formulas','practice','exam'].indexOf(mode));
    }
    function setActiveTab(i) {
      document.querySelectorAll('.nav-tab').forEach((t,j) => t.classList.toggle('active', i===j));
