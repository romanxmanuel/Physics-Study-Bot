  <title>Physics 2 Study Bot — Exam 2</title>
  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #23263a;
      --border: #2e3250;
      --accent: #6c7aff;
      --accent2: #a78bfa;
      --green: #34d399;
      --red: #f87171;
      --yellow: #fbbf24;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    /* ── LAYOUT ── */
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky; top: 0; z-index: 100;
    }
    header h1 { font-size: 1rem; font-weight: 600; color: var(--accent); }
    header h1 span { color: var(--text-dim); font-weight: 400; }
    main { flex: 1; padding: 32px 24px; max-width: 800px; margin: 0 auto; width: 100%; }

    /* ── NAV TABS ── */
    .nav-tabs {
      display: flex; gap: 4px;
      background: var(--surface2);
      border-radius: 10px; padding: 4px;
    }
    .nav-tab {
      flex: 1; padding: 8px 12px; border: none; border-radius: 8px;
      background: transparent; color: var(--text-dim);
      cursor: pointer; font-size: 0.85rem; font-weight: 500;
      transition: all 0.15s;
    }
    .nav-tab:hover { color: var(--text); background: var(--surface); }
    .nav-tab.active { background: var(--accent); color: #fff; }

    /* ── CARDS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }
    .card + .card { margin-top: 16px; }
    .card-label {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
    }
    .card h2 { font-size: 1.4rem; margin-bottom: 12px; }
    .card p { color: var(--text-dim); margin-bottom: 10px; }
    .card p:last-child { margin-bottom: 0; }

    /* ── PROGRESS BAR ── */
    .progress-wrap { margin-bottom: 24px; }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 0.8rem; color: var(--text-dim); margin-bottom: 6px;
    }
    .progress-bar {
      height: 6px; background: var(--surface2);
      border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px; transition: width 0.3s ease;
    }
    .progress-fill.hot { background: linear-gradient(90deg, #fb7185, #f59e0b); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 8px; border: none;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-secondary {
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-success { background: var(--green); color: #0f2a1e; }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }

    /* ── GAME LAYER ── */
    .hero-panel {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(108,122,255,0.18), transparent 34%),
        radial-gradient(circle at bottom right, rgba(251,191,36,0.12), transparent 30%),
        var(--surface);
    }
    .hero-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.03) 48%, transparent 100%);
      pointer-events: none;
    }
    .hud-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .hud-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      min-width: 0;
    }
    .hud-value {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
    }
    .hud-meta {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .xp-track {
      height: 8px;
      margin-top: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
    }
    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #34d399, #6c7aff);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .mission-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .mission-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .mission-card strong { display: block; margin-bottom: 6px; }
    .focus-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: linear-gradient(135deg, rgba(108,122,255,0.12), rgba(251,191,36,0.1));
      border: 1px solid rgba(108,122,255,0.25);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .focus-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent2);
      margin-bottom: 4px;
    }
    .focus-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }
    .focus-metrics {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .metric-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.78rem;
    }
    .metric-pill.hot {
      color: #ffd166;
      border-color: rgba(251,191,36,0.3);
      background: rgba(251,191,36,0.08);
    }
    .achievement-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .achievement {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface2);
      font-size: 0.78rem;
      color: var(--text-dim);
    }
    .achievement.unlocked {
      color: #ffe8a3;
      border-color: rgba(251,191,36,0.35);
      background: rgba(251,191,36,0.08);
    }
    .boss-tag {
      color: #ffd166;
      border-color: rgba(251,191,36,0.4);
      background: rgba(251,191,36,0.08);
    }

    /* ── FORMULA BOX ── */
    .formula {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      margin: 12px 0;
      color: var(--accent2);
    }

    /* ── ANALOGY BOX ── */
    .analogy {
      background: var(--surface2);
      border-radius: 8px; padding: 14px 16px;
      border-left: 3px solid var(--yellow);
      margin: 12px 0;
    }
    .analogy-label {
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--yellow); margin-bottom: 4px;
    }

    /* ── ANSWER CHOICES ── */
    .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .choice {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      color: var(--text);
      font-size: 0.95rem;
    }
    .choice:hover { border-color: var(--accent); }
    .choice.correct { border-color: var(--green); background: rgba(52,211,153,0.1); color: var(--green); }
    .choice.wrong { border-color: var(--red); background: rgba(248,113,113,0.1); color: var(--red); }
    .choice.reveal-correct { border-color: var(--green); background: rgba(52,211,153,0.08); }
    .choice:disabled, .choice.locked { pointer-events: none; }

    /* ── EXPLANATION BOX ── */
    .explanation {
      background: var(--surface2);
      border-radius: 8px; padding: 14px 16px;
      border-left: 3px solid var(--green);
      margin-top: 16px; display: none;
    }
    .explanation.wrong-exp { border-left-color: var(--red); }
    .explanation.show { display: block; }
    .explanation-label {
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--green); margin-bottom: 6px;
    }
    .explanation.wrong-exp .explanation-label { color: var(--red); }

    /* ── SCORE BADGE ── */
    .score-badge {
      display: inline-flex; flex-direction: column; align-items: center;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 32px;
      margin: 16px 0;
    }
    .score-num {
      font-size: 3rem; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .score-label { font-size: 0.85rem; color: var(--text-dim); margin-top: 4px; }

    /* ── TOPIC PILL ── */
    .topic-pill {
      display: inline-block;
      padding: 2px 10px; border-radius: 99px;
      font-size: 0.75rem; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-dim); margin-bottom: 12px;
    }

    /* ── FORMULA SHEET SIDEBAR ── */
    .exam-layout { display: flex; gap: 20px; align-items: flex-start; }
    .exam-main { flex: 1; min-width: 0; }
    .formula-sheet {
      width: 240px; flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      position: sticky; top: 76px;
    }
    .formula-sheet h3 {
      font-size: 0.8rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--accent); margin-bottom: 12px;
    }
    .formula-sheet .f {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem; color: var(--accent2);
      line-height: 1.8;
    }
    .formula-sheet hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

    /* ── HOME SCREEN ── */
    .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
    .home-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .home-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .home-card-icon { font-size: 2rem; margin-bottom: 12px; }
    .home-card h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .home-card p { font-size: 0.85rem; color: var(--text-dim); }
    .home-card .badge {
      display: inline-block; margin-top: 12px;
      background: var(--surface2); border-radius: 99px;
      padding: 2px 10px; font-size: 0.75rem; color: var(--accent);
    }

    /* ── STATUS INDICATOR ── */
    .weak-indicator {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.78rem; color: var(--yellow);
      background: rgba(251,191,36,0.1); border-radius: 99px;
      padding: 3px 10px; margin-left: 8px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .home-grid { grid-template-columns: 1fr; }
      .hud-grid { grid-template-columns: 1fr 1fr; }
      .mission-grid { grid-template-columns: 1fr; }
      .exam-layout { flex-direction: column; }
      .formula-sheet { width: 100%; position: static; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>⚡ Physics 2 Study Bot <span>— Exam 2: Ch 20 + 21</span></h1>
      <div class="nav-tabs" id="nav">
        <button class="nav-tab active" onclick="goHome()">Home</button>
        <button class="nav-tab" onclick="goMode('learn')">Learn</button>
        <button class="nav-tab" onclick="goMode('formulas')">Formulas</button>
        <button class="nav-tab" onclick="goMode('practice')">Practice</button>
        <button class="nav-tab" onclick="goMode('exam')">Mock Exam</button>
      </div>
    </header>
    <main id="main"></main>
  </div>
  <script>
    const STORAGE_KEY = 'physicsBot_weakTopics';
    const PROFILE_KEY = 'physicsBot_profile';
    const EXAM_DURATION_SECONDS = 25 * 60;
    const EXAM_QUESTION_COUNT = 16;
    const XP_PER_LEVEL = 140;

    const state = {
      mode: 'home',
      learnIndex: 0,
      formulaIndex: 0,
      practiceQueue: [],
      practiceIndex: 0,
      practiceAnswered: false,
      practiceResults: [],
      practiceRequeues: {},
      practiceTopicFilter: null,
      selectedChoice: null,
      weakTopics: {},
      examQuestions: [],
      examIndex: 0,
      examAnswers: [],
      examAnswered: false,
      examTimeRemaining: EXAM_DURATION_SECONDS,
      examTimerId: null,
      currentStreak: 0,
      sessionXp: 0,
      questionStartedAt: 0,
      profile: {
        xp: 0,
        sessions: 0,
        totalAnswered: 0,
        totalCorrect: 0,
        bestStreak: 0,
        achievements: {},
      },
    };

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) state.weakTopics = JSON.parse(saved);
    } catch (error) {
      state.weakTopics = {};
    }
    try {
      const savedProfile = localStorage.getItem(PROFILE_KEY);
      if (savedProfile) {
        state.profile = { ...state.profile, ...JSON.parse(savedProfile) };
      }
    } catch (error) {
      state.profile = { ...state.profile };
    }

const CONCEPTS = [
  // ── CHAPTER 20 ──
  {
    chapter: 'Ch 20',
    topic: 'Electric Current',
    title: 'What is Electric Current?',
    body: `Electric current is simply the flow of electric charge through a wire. Think of a wire like a garden hose — water flowing through the hose is like charge flowing through the wire.\n\nCurrent (I) measures how much charge passes a point per second. If a lot of charge flows per second, you have a large current. The unit is the <strong>ampere (A)</strong>, which equals 1 coulomb per second.`,
    analogy: 'Water hose: Current = gallons per minute flowing past a point. A fire hose has high current (lots of water per second). A dripping faucet has tiny current.',
    formula: 'I = ΔQ / Δt',
    formulaNote: 'I = current (A), ΔQ = charge that passed (C), Δt = time (s)',
  },
  {
    chapter: 'Ch 20',
    topic: 'Conventional Current',
    title: 'Which Way Does Current Flow?',
    body: `Electrons (negative charges) actually flow from the negative terminal of a battery to the positive terminal. BUT by historical convention, we define current direction as the flow of <em>positive</em> charges — which is the opposite direction.\n\nThis "conventional current" flows from + to −, while electrons flow from − to +. For most problems you just need to know the direction of conventional current. Don't let this confuse you — both descriptions give the same physics.`,
    analogy: 'Imagine positive charges going right and negative charges going left — both mean current is flowing right. Same result, different way to think about it.',
    formula: null,
    formulaNote: null,
  },
  {
    chapter: 'Ch 20',
    topic: 'Drift Velocity',
    title: 'How Fast Do Electrons Actually Move?',
    body: `Electrons in a wire bounce around randomly at very high speeds (~1,000,000 m/s). But their net drift in one direction (drift velocity) is incredibly slow — millimeters per second.\n\nWhy does a light turn on instantly then? Because the electric field propagates nearly at the speed of light and pushes ALL electrons in the wire simultaneously — like pushing one end of a full pipe makes water come out the other end instantly.`,
    analogy: 'A pipe full of water: push one end and water comes out the other immediately, even though individual water molecules move slowly.',
    formula: 'I = n·q·A·v_d',
    formulaNote: 'n = free charge density (#/m³), q = charge per carrier (1.6×10⁻¹⁹ C), A = cross-section area (m²), v_d = drift speed (m/s)',
  },
  {
    chapter: 'Ch 20',
    topic: "Ohm's Law",
    title: "Ohm's Law: Voltage, Current, Resistance",
    body: `<strong>Voltage (V)</strong> is the "push" that drives current — like water pressure in a hose. More voltage = more push.\n\n<strong>Resistance (R)</strong> is how much the wire/component fights the flow — like a narrow hose section. More resistance = less current for the same voltage.\n\nOhm's Law: these three quantities are always related. If you know two, you can find the third. Unit of resistance: <strong>ohm (Ω)</strong>.`,
    analogy: 'Voltage = water pressure. Current = flow rate. Resistance = how narrow the pipe is. Narrow pipe (high R) → less flow (low I) for the same pressure (V).',
    formula: 'V = I × R   →   I = V/R   →   R = V/I',
    formulaNote: 'V = voltage (volts), I = current (amps), R = resistance (ohms Ω)',
  },
  {
    chapter: 'Ch 20',
    topic: 'Resistivity',
    title: 'Resistance Depends on Material and Shape',
    body: `The resistance of a wire depends on three things:\n• What it's made of (material property: <strong>resistivity ρ</strong>)\n• How long it is (longer = more resistance)\n• How thick it is (thicker = less resistance)\n\n<strong>Resistivity (ρ)</strong> is a property of the material itself — copper has low resistivity (good conductor), rubber has high resistivity (insulator). Units: Ω·m.`,
    analogy: 'A long, thin garden hose resists water flow more than a short, fat pipe. The hose material also matters — a sponge-filled hose would resist even more.',
    formula: 'R = ρ · L / A',
    formulaNote: 'ρ = resistivity (Ω·m), L = length (m), A = cross-section area (m²)',
  },
  {
    chapter: 'Ch 20',
    topic: 'Electric Power',
    title: 'Electric Power: How Much Energy Per Second?',
    body: `Power is how fast energy is used or delivered. A 100W light bulb uses 100 joules of energy every second.\n\nElectric power depends on both current and voltage. There are three equivalent formulas — use whichever one has the variables you know.`,
    analogy: 'A wide river (high I) with a big waterfall (high V) delivers enormous power. A tiny stream with a tiny drop delivers almost none.',
    formula: 'P = I·V = V²/R = I²·R',
    formulaNote: 'P = power (watts W), I = current (A), V = voltage (V), R = resistance (Ω)',
  },
  {
    chapter: 'Ch 20',
    topic: 'AC vs DC',
    title: 'AC vs DC Current',
    body: `<strong>DC (Direct Current):</strong> Charge flows in one direction only. Batteries produce DC. Constant voltage and current.\n\n<strong>AC (Alternating Current):</strong> The direction of current reverses periodically — it oscillates back and forth, typically 60 times per second (60 Hz) in North America. This is what comes from a wall outlet.\n\nThe voltage and current in AC circuits are described by sine waves: V = V₀ sin(2πft)`,
    analogy: 'DC = a river flowing steadily one way. AC = ocean waves going back and forth.',
    formula: 'V = V₀ sin(2πft)   and   I = I₀ sin(2πft)',
    formulaNote: 'V₀, I₀ = peak values, f = frequency (Hz), t = time (s)',
  },
  {
    chapter: 'Ch 20',
    topic: 'RMS Values',
    title: 'RMS Values: The "Effective" AC Values',
    body: `Since AC voltage and current constantly change, we can't use peak values directly in power calculations. Instead we use <strong>RMS (root mean square)</strong> values — these are the "equivalent DC values" that would produce the same heating effect.\n\nFor a sinusoidal AC signal, the RMS value is simply the peak value divided by √2 ≈ 1.414.\n\nThe "120V" from your wall outlet is actually the RMS voltage. The peak voltage is 120 × √2 ≈ 170V.`,
    analogy: 'An AC bulb flickering 60 times/second looks as bright as a DC bulb at the RMS voltage. The RMS is what "matters" for power.',
    formula: 'I_rms = I₀/√2   and   V_rms = V₀/√2',
    formulaNote: 'I₀, V₀ = peak values. For power: P̄ = I_rms·V_rms = V²_rms/R = I²_rms·R',
  },
  {
    chapter: 'Ch 20',
    topic: 'Electrical Hazards',
    title: 'Electrical Hazards: Thermal and Shock',
    body: `<strong>Thermal hazard:</strong> Too much current heats wires and can cause fires. This is what fuses and circuit breakers protect against.\n\n<strong>Shock hazard:</strong> When current passes through a human body, it can cause muscle contractions, heart fibrillation, or death. Even small currents are dangerous:\n• 1 mA: barely feels it\n• 10 mA: painful, may not let go\n• 100 mA: potentially fatal (heart fibrillation)\n\nThe body has resistance (~300kΩ dry, much lower wet), so high voltages push dangerous currents through us.`,
    analogy: 'Your body is a resistor. V = IR means higher voltage → higher current through you. Wet skin lowers R, making shocks much more dangerous.',
    formula: null,

    function saveWeakTopics() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.weakTopics));
      } catch (error) {
        // Ignore storage failures in offline/private browsing contexts.
      }
    }
    function saveProfile() {
      try {
        localStorage.setItem(PROFILE_KEY, JSON.stringify(state.profile));
      } catch (error) {
        // Ignore storage failures.
      }
    }

    function getLevelInfo() {
      const level = Math.floor(state.profile.xp / XP_PER_LEVEL) + 1;
      const current = state.profile.xp % XP_PER_LEVEL;
      return {
        level,
        current,
        needed: XP_PER_LEVEL,
        pct: (current / XP_PER_LEVEL) * 100,
      };
    }

    function getAccuracyPct() {
      if (!state.profile.totalAnswered) return 0;
      return Math.round((state.profile.totalCorrect / state.profile.totalAnswered) * 100);
    }

    function getFlowLabel() {
      if (state.currentStreak >= 10) return 'Deep Focus';
      if (state.currentStreak >= 6) return 'Locked In';
      if (state.currentStreak >= 3) return 'Momentum';
      return 'Warm-up';
    }

    function getComboMultiplier() {
      return 1 + Math.min(0.75, state.currentStreak * 0.05);
    }

    function isBossRound(index) {
      return (index + 1) % 5 === 0;
    }

    function unlockAchievement(key) {
      if (!state.profile.achievements[key]) {
        state.profile.achievements[key] = true;
        saveProfile();
      }
    }

    function getVisibleAchievements() {
      const defs = [
        ['streak_5', '5-hit streak'],
        ['streak_10', '10-hit streak'],
        ['speed_3', '3 fast solves'],
        ['exam_80', 'Exam 80%'],
        ['exam_100', 'Perfect exam'],
      ];
      return defs.map(([key, label]) => ({ key, label, unlocked: !!state.profile.achievements[key] }));
    }

    function applyAnswerOutcome({ isRight, mode, elapsedMs, bossRound }) {
      state.profile.totalAnswered += 1;
      let gainedXp = 0;

      if (isRight) {
        state.currentStreak += 1;
        state.profile.totalCorrect += 1;
        state.profile.bestStreak = Math.max(state.profile.bestStreak, state.currentStreak);

        const base = mode === 'exam' ? 34 : 22;
        const speedBonus = elapsedMs <= 12000 ? 10 : elapsedMs <= 20000 ? 5 : 0;
        const comboBonus = Math.round(base * (getComboMultiplier() - 1));
        const bossBonus = bossRound ? 12 : 0;
        gainedXp = base + speedBonus + comboBonus + bossBonus;

        if (state.currentStreak >= 5) unlockAchievement('streak_5');
        if (state.currentStreak >= 10) unlockAchievement('streak_10');
        if (elapsedMs <= 12000) {
          state.profile.fastAnswers = (state.profile.fastAnswers || 0) + 1;
          if (state.profile.fastAnswers >= 3) unlockAchievement('speed_3');
        }
      } else {
        state.currentStreak = 0;
      }

      state.profile.xp += gainedXp;
      state.sessionXp += gainedXp;
      saveProfile();
      return gainedXp;
    }

      const level = getLevelInfo();
      const accuracy = getAccuracyPct();
      return `
        <div class="focus-banner">
          <div>
            <div class="focus-title">${modeLabel} focus state</div>
            <div class="focus-value">${getFlowLabel()}</div>

            <span class="metric-pill">Session XP +${state.sessionXp}</span>

          </div>

        <div class="hud-grid">

            <div class="hud-value">${accuracy}%</div>

          </div>

    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function scrollTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function paragraphize(text) {
      return text
        .split('\n\n')
        .map((block) => `<p>${block.replace(/\n/g, '<br>')}</p>`)
        .join('');
    }

    function formatTime(totalSeconds) {
      const safe = Math.max(0, totalSeconds);
      const minutes = Math.floor(safe / 60);
      const seconds = safe % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function getWeakTopics(minWrong = 2) {
      return Object.entries(state.weakTopics)
        .filter(([, wrong]) => wrong >= minWrong)
        .sort((a, b) => b[1] - a[1]);
    }

    function buildFormulaSheet() {
      const groups = FORMULAS.reduce((acc, formula) => {
        (acc[formula.chapter] ||= []).push(formula);
        return acc;
      }, {});

      return `
        <div class="formula-sheet">
          <h3>Formula Sheet</h3>
          ${Object.entries(groups).map(([chapter, formulas]) => `
            <div class="f"><strong>${chapter}</strong><br>${formulas.map((formula) => formula.formula).join('<br>')}</div>
            <hr>
          `).join('')}
        </div>`;
    }

    function clearExamTimer() {
      if (state.examTimerId) {
        clearInterval(state.examTimerId);
        state.examTimerId = null;
      }
    }

    function startExamTimer() {
      clearExamTimer();
      state.examTimerId = setInterval(() => {
        if (state.mode !== 'exam') {
          clearExamTimer();
          return;
        }
        state.examTimeRemaining -= 1;
        if (state.examTimeRemaining <= 0) {
          state.examTimeRemaining = 0;
          clearExamTimer();
          renderExamResults(true);
          return;
        }
        renderExam();
      }, 1000);
    }

    function getTopicStats(items) {
      const stats = {};
      items.forEach((item) => {
        const key = item.q.topic;
        if (!stats[key]) stats[key] = { topic: key, total: 0, correct: 0 };
        stats[key].total += 1;
        if (item.isRight) stats[key].correct += 1;
      });
      return Object.values(stats).sort((a, b) => (a.correct / a.total) - (b.correct / b.total));
    }

    function goHome() {
      clearExamTimer();
      state.mode = 'home';
      renderHome();
      setActiveTab(0);
    }

    function goMode(mode) {
      if (state.mode === 'exam' && mode !== 'exam') clearExamTimer();
      state.mode = mode;
      if (mode === 'learn') {
        state.learnIndex = 0;
        renderLearn();
      } else if (mode === 'formulas') {
        state.formulaIndex = 0;
        renderFormulas();
      } else if (mode === 'practice') {
        startPractice();
      } else if (mode === 'exam') {
        startExam();
      }
      setActiveTab(['home', 'learn', 'formulas', 'practice', 'exam'].indexOf(mode));
    }

    function setActiveTab(index) {
      document.querySelectorAll('.nav-tab').forEach((tab, current) => {
        tab.classList.toggle('active', current === index);
      });
    }

            <div class="home-card-icon">🎯</div>
            <h3>3. Practice</h3>
            <p>Immediate feedback, explanations, and weak-topic requeueing once a topic is missed multiple times.</p>
            <span class="badge">${QUESTIONS.length} questions</span>
          </div>
          <div class="home-card" onclick="goMode('exam')">
            <div class="home-card-icon">📝</div>
            <h3>4. Mock Exam</h3>
            <p>16 random questions, 25-minute timer, formula sheet sidebar, and a full review at the end.</p>
            <span class="badge">16-question exam</span>
          </div>
        </div>`;
    }

    function renderLearn() {
      const concept = CONCEPTS[state.learnIndex];
      const total = CONCEPTS.length;
      const progress = ((state.learnIndex + 1) / total) * 100;

      document.getElementById('main').innerHTML = `
        <div class="progress-wrap">
          <div class="progress-label"><span>Concept ${state.learnIndex + 1} of ${total}</span><span>${Math.round(progress)}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        </div>
        <div class="card">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
            <span class="topic-pill">${concept.chapter}</span>
            <span class="topic-pill">${concept.topic}</span>
          </div>
          <h2>${concept.title}</h2>
          <div class="analogy">
            <div class="analogy-label">Water analogy</div>
            <p>${concept.analogy}</p>
          </div>
          <div class="card" style="margin-top:16px;background:var(--surface2)">
            <div class="card-label">Explanation</div>
            ${paragraphize(concept.body)}
          </div>
          ${concept.formula ? `
            <div class="card" style="margin-top:16px;background:var(--surface2)">
              <div class="card-label">Core equation</div>
              <div class="formula" style="margin-bottom:8px">${concept.formula}</div>
              <p>${concept.formulaNote || 'Know when to apply this relationship.'}</p>
            </div>` : ''}
          <div class="btn-row">
            <button class="btn btn-secondary" onclick="prevConcept()" ${state.learnIndex === 0 ? 'disabled' : ''}>← Previous</button>
            <button class="btn btn-primary" onclick="nextConcept()">${state.learnIndex < total - 1 ? 'Next →' : 'Move to Formulas →'}</button>
          </div>
        </div>`;
    }

    function prevConcept() {
      if (state.learnIndex > 0) {
        state.learnIndex -= 1;
        renderLearn();
        scrollTop();
      }
    }

    function nextConcept() {
      if (state.learnIndex < CONCEPTS.length - 1) {
        state.learnIndex += 1;
        renderLearn();
        scrollTop();
      } else {
        goMode('formulas');
      }
    }

    function renderFormulas() {
      const formula = FORMULAS[state.formulaIndex];
      const total = FORMULAS.length;
      const progress = ((state.formulaIndex + 1) / total) * 100;

      document.getElementById('main').innerHTML = `
        <div class="progress-wrap">
          <div class="progress-label"><span>Formula ${state.formulaIndex + 1} of ${total}</span><span>${Math.round(progress)}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        </div>
        <div class="card">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
            <span class="topic-pill">${formula.chapter}</span>
            <span class="topic-pill">${formula.name}</span>
          </div>
          <h2>${formula.name}</h2>
          <div class="formula" style="font-size:1.25rem">${formula.formula}</div>
          <div class="card" style="margin-top:16px;background:var(--surface2)">
            <div class="card-label">Variables</div>
            <table style="width:100%;border-collapse:collapse;color:var(--text-dim);font-size:0.92rem">
              ${formula.vars.map((item) => `
                <tr style="border-bottom:1px solid var(--border)">
                  <td style="padding:10px 0;color:var(--accent2);font-family:'Courier New',monospace;width:90px">${item.sym}</td>
                  <td style="padding:10px 12px 10px 0">${item.meaning}</td>
                  <td style="padding:10px 0;text-align:right;white-space:nowrap">${item.unit}</td>
                </tr>`).join('')}
            </table>
          </div>
          <div class="card" style="margin-top:16px;background:var(--surface2)">
            <div class="card-label">Plain English</div>
            <p>${formula.plain}</p>
          </div>
          <div class="btn-row">
            <button class="btn btn-secondary" onclick="prevFormula()" ${state.formulaIndex === 0 ? 'disabled' : ''}>← Previous</button>
            <button class="btn btn-primary" onclick="nextFormula()">${state.formulaIndex < total - 1 ? 'Next →' : 'Start Practice →'}</button>
          </div>
        </div>`;
    }

    function prevFormula() {
      if (state.formulaIndex > 0) {
        state.formulaIndex -= 1;
        renderFormulas();
        scrollTop();
      }
    }

    function nextFormula() {
      if (state.formulaIndex < FORMULAS.length - 1) {
        state.formulaIndex += 1;
        renderFormulas();
        scrollTop();
      } else {
        goMode('practice');
      }
    }

    function startPractice(topicFilter = null) {
      const shuffled = shuffle(QUESTIONS.filter((question) => !topicFilter || question.topic === topicFilter));
      const pool = shuffled.sort((a, b) => (state.weakTopics[b.topic] || 0) - (state.weakTopics[a.topic] || 0));

      state.mode = 'practice';
      state.practiceTopicFilter = topicFilter;
      state.practiceQueue = pool;
      state.practiceIndex = 0;
      state.practiceAnswered = false;
      state.practiceResults = [];
      state.practiceRequeues = {};
      state.selectedChoice = null;
      state.sessionXp = 0;
      state.currentStreak = 0;
      state.questionStartedAt = Date.now();
      state.profile.sessions += 1;
      saveProfile();
      setActiveTab(3);
      renderPractice();
      scrollTop();
    }

    function renderPractice() {
      if (state.practiceIndex >= state.practiceQueue.length) {
        renderPracticeResults();
        return;
      }

      const question = state.practiceQueue[state.practiceIndex];
      const total = state.practiceQueue.length;
      const progress = ((state.practiceIndex + 1) / total) * 100;
      const weakCount = state.weakTopics[question.topic] || 0;
      const filterPill = state.practiceTopicFilter ? `<span class="topic-pill">Targeted drill</span>` : '';
      const bossRound = isBossRound(state.practiceIndex);

      document.getElementById('main').innerHTML = `
        ${renderGameHud('Practice')}
        <div class="progress-wrap">
          <div class="progress-label"><span>Question ${state.practiceIndex + 1} of ${total}</span><span>${Math.round(progress)}%</span></div>
          <div class="progress-bar"><div class="progress-fill ${bossRound ? 'hot' : ''}" style="width:${progress}%"></div></div>
        </div>
        <div class="card">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px">
            <span class="topic-pill">${question.chapter}</span>
            <span class="topic-pill">${question.topic}</span>
            <span class="topic-pill">${question.type}</span>
            ${filterPill}
            ${bossRound ? '<span class="topic-pill boss-tag">Boss round</span>' : ''}
            ${weakCount >= 2 ? `<span class="weak-indicator">Weak topic: ${weakCount} misses</span>` : ''}
          </div>
          <h2 style="font-size:1.15rem">${question.q}</h2>
          <div class="choices">
            ${question.choices.map((choice, index) => {
              const result = state.practiceAnswered ? state.practiceResults[state.practiceResults.length - 1] : null;
              let cls = 'choice';
              if (result && result.q.q === question.q) {
                if (index === question.answer) cls += ' correct';
                else if (index === result.chosen && !result.isRight) cls += ' wrong';
              }
              return `<button class="${cls}" onclick="submitPractice(${index})" ${state.practiceAnswered ? 'disabled' : ''}><strong style="margin-right:8px;opacity:0.55">${String.fromCharCode(65 + index)}.</strong>${choice}</button>`;
            }).join('')}
          </div>
          ${state.practiceAnswered ? `
            <div class="explanation ${state.practiceResults[state.practiceResults.length - 1].isRight ? '' : 'wrong-exp'} show">
              <div class="explanation-label">${state.practiceResults[state.practiceResults.length - 1].isRight ? 'Correct' : 'Incorrect'}</div>
              <p>${question.explain}</p>
            </div>
            <div class="btn-row">
              <button class="btn btn-primary" onclick="nextPracticeQuestion()">${state.practiceIndex < total - 1 ? 'Next Question →' : 'See Results →'}</button>
            </div>` : ''}
        </div>`;
    }

    function submitPractice(choiceIndex) {
      if (state.practiceAnswered) return;

      const question = state.practiceQueue[state.practiceIndex];
      const isRight = choiceIndex === question.answer;
      const elapsedMs = Date.now() - state.questionStartedAt;
      const bossRound = isBossRound(state.practiceIndex);
      state.practiceAnswered = true;
      state.selectedChoice = choiceIndex;
      const gainedXp = applyAnswerOutcome({ isRight, mode: 'practice', elapsedMs, bossRound });
      state.practiceResults.push({ q: question, chosen: choiceIndex, isRight, gainedXp, elapsedMs, bossRound });

      if (!isRight) {
        state.weakTopics[question.topic] = (state.weakTopics[question.topic] || 0) + 1;
        saveWeakTopics();

        const key = question.q;
        if (state.weakTopics[question.topic] >= 2 && !state.practiceRequeues[key]) {
          state.practiceQueue.push(question);
          state.practiceRequeues[key] = true;
        }
      }

      renderPractice();
    }

    function nextPracticeQuestion() {
      state.practiceIndex += 1;
      state.practiceAnswered = false;
      state.selectedChoice = null;
      state.questionStartedAt = Date.now();
      renderPractice();
      scrollTop();
    }

    function renderPracticeResults() {
      const total = state.practiceResults.length;
      const correct = state.practiceResults.filter((result) => result.isRight).length;
      const percent = total ? Math.round((correct / total) * 100) : 0;
      const weakTopics = getWeakTopics();
      const level = getLevelInfo();
      const topicButtons = weakTopics.slice(0, 3).map(([topic, wrong]) => `
        <button class="btn btn-secondary" onclick="startPractice(${JSON.stringify(topic)})">Drill ${topic} (${wrong})</button>`).join('');

      document.getElementById('main').innerHTML = `
        <div class="card" style="text-align:center">
          <div class="card-label">Practice complete</div>
          <h2>Practice session finished</h2>
          <div class="score-badge" style="margin:20px auto 8px">
            <div class="score-num">${correct}/${total}</div>
            <div class="score-label">${percent}% correct</div>
          </div>
          <p>Session XP gained: <strong style="color:var(--accent2)">+${state.sessionXp}</strong> · Current level: <strong>Lv ${level.level}</strong></p>
          <p>${weakTopics.length ? 'Repeated misses were flagged. Review those topics before the mock exam.' : 'No topic has hit the weak-topic threshold. You can move straight into the mock exam.'}</p>
          ${weakTopics.length ? `
            <div class="analogy" style="margin-top:18px;text-align:left">
              <div class="analogy-label">Weak topics</div>
              ${weakTopics.map(([topic, wrong]) => `<p style="margin-bottom:6px">${topic}: ${wrong} misses</p>`).join('')}
            </div>` : ''}
          <div class="btn-row" style="justify-content:center">
            ${topicButtons}
            <button class="btn btn-secondary" onclick="startPractice()">Practice All Again</button>
            <button class="btn btn-primary" onclick="goMode('exam')">Take Mock Exam →</button>
          </div>
        </div>`;
    }

    function startExam() {
      clearExamTimer();
      state.mode = 'exam';
      state.examQuestions = shuffle(QUESTIONS).slice(0, Math.min(EXAM_QUESTION_COUNT, QUESTIONS.length));
      state.examIndex = 0;
      state.examAnswers = [];
      state.examAnswered = false;
      state.examTimeRemaining = EXAM_DURATION_SECONDS;
      state.sessionXp = 0;
      state.currentStreak = 0;
      state.questionStartedAt = Date.now();
      state.profile.sessions += 1;
      saveProfile();
      setActiveTab(4);
      startExamTimer();
      renderExam();
      scrollTop();
    }

    function renderExam() {
      if (state.examIndex >= state.examQuestions.length) {
        renderExamResults(false);
        return;
      }

      const question = state.examQuestions[state.examIndex];
      const result = state.examAnswers[state.examIndex];
      const total = state.examQuestions.length;
      const progress = ((state.examIndex + 1) / total) * 100;
      const bossRound = isBossRound(state.examIndex);

      document.getElementById('main').innerHTML = `
        ${renderGameHud('Mock Exam')}
        <div class="progress-wrap">
          <div class="progress-label">
            <span>Question ${state.examIndex + 1} of ${total}</span>
            <span>${Math.round(progress)}%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill ${bossRound ? 'hot' : ''}" style="width:${progress}%"></div></div>
        </div>
        <div class="exam-layout">
          <div class="exam-main">
            <div class="card">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px">
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                  <span class="topic-pill">${question.chapter}</span>
                  <span class="topic-pill">${question.topic}</span>
                  <span class="topic-pill">${question.type}</span>
                  ${bossRound ? '<span class="topic-pill boss-tag">Boss round</span>' : ''}
                </div>
                <div class="topic-pill" style="color:${state.examTimeRemaining <= 300 ? 'var(--red)' : 'var(--accent)'}">Time left: ${formatTime(state.examTimeRemaining)}</div>
              </div>
              <h2 style="font-size:1.15rem">${question.q}</h2>
              <div class="choices">
                ${question.choices.map((choice, index) => {
                  let cls = 'choice';
                  if (result) {
                    if (index === question.answer) cls += ' correct';
                    else if (index === result.chosen && !result.isRight) cls += ' wrong';
                  }
                  return `<button class="${cls}" onclick="submitExam(${index})" ${result ? 'disabled' : ''}><strong style="margin-right:8px;opacity:0.55">${String.fromCharCode(65 + index)}.</strong>${choice}</button>`;
                }).join('')}
              </div>
              ${result ? `
                <div class="explanation ${result.isRight ? '' : 'wrong-exp'} show">
                  <div class="explanation-label">${result.isRight ? 'Correct' : 'Incorrect'}</div>
                  <p>${question.explain}</p>
                </div>
                <div class="btn-row">
                  <button class="btn ${state.examIndex < total - 1 ? 'btn-primary' : 'btn-success'}" onclick="nextExamQuestion()">${state.examIndex < total - 1 ? 'Next →' : 'Finish Exam'}</button>
                </div>` : ''}
            </div>
          </div>
          ${buildFormulaSheet()}
        </div>`;
    }

    function submitExam(choiceIndex) {
      if (state.examAnswers[state.examIndex]) return;

      const question = state.examQuestions[state.examIndex];
      const isRight = choiceIndex === question.answer;
      const elapsedMs = Date.now() - state.questionStartedAt;
      const bossRound = isBossRound(state.examIndex);
      const gainedXp = applyAnswerOutcome({ isRight, mode: 'exam', elapsedMs, bossRound });
      state.examAnswers[state.examIndex] = {
        q: question,
        chosen: choiceIndex,
        correct: question.answer,
        isRight,
        gainedXp,
      };

      if (!isRight) {
        state.weakTopics[question.topic] = (state.weakTopics[question.topic] || 0) + 1;
        saveWeakTopics();
      }

      state.examAnswered = true;
      renderExam();
    }

    function nextExamQuestion() {
      state.examIndex += 1;
      state.examAnswered = false;
      state.questionStartedAt = Date.now();
      renderExam();
      scrollTop();
    }

    function renderExamResults(timedOut = false) {
      clearExamTimer();

      const answers = state.examQuestions.map((question, index) => {
        return state.examAnswers[index] || {
          q: question,
          chosen: null,
          correct: question.answer,
          isRight: false,
          unanswered: true,
        };
      });

      const total = answers.length;
      const correct = answers.filter((answer) => answer.isRight).length;
      const percent = total ? Math.round((correct / total) * 100) : 0;
      const unanswered = answers.filter((answer) => answer.unanswered).length;
      const grade = percent >= 90 ? 'A' : percent >= 80 ? 'B' : percent >= 70 ? 'C' : percent >= 60 ? 'D' : 'F';
      const topicStats = getTopicStats(answers);
      const earnedXp = answers.reduce((sum, answer) => sum + (answer.gainedXp || 0), 0);
      const message = percent >= 80
        ? 'Strong exam-level performance. Review any misses and you are in good shape.'
        : percent >= 60
          ? 'Passing range, but there are still gaps worth drilling before test day.'
          : 'This needs another pass through Learn and Practice before relying on the mock score.';

      if (percent >= 80) unlockAchievement('exam_80');
      if (percent === 100) unlockAchievement('exam_100');

      document.getElementById('main').innerHTML = `
        <div class="card">
          <div class="card-label">Mock exam results</div>
          <h2>${timedOut ? 'Time expired' : 'Exam complete'}</h2>
          <div class="score-badge">
            <div class="score-num">${correct}/${total}</div>
            <div class="score-label">${percent}% · Grade ${grade}</div>
          </div>
          <p>Exam XP earned: <strong style="color:var(--accent2)">+${earnedXp}</strong></p>
          <p>${message}</p>
          <p>${unanswered ? `${unanswered} question${unanswered === 1 ? '' : 's'} were left unanswered when the exam ended.` : `You completed all ${total} questions within ${formatTime(EXAM_DURATION_SECONDS - state.examTimeRemaining)}.`}</p>
          ${topicStats.length ? `
            <div class="card" style="margin-top:16px;background:var(--surface2)">
              <div class="card-label">Topic breakdown</div>
              ${topicStats.map((stat) => `<p>${stat.topic}: ${stat.correct}/${stat.total} correct</p>`).join('')}
            </div>` : ''}
          <div class="btn-row">
            <button class="btn btn-secondary" onclick="startExam()">Retake Exam</button>
            <button class="btn btn-secondary" onclick="startPractice()">Practice All</button>
            <button class="btn btn-primary" onclick="goHome()">Back Home</button>
          </div>
        </div>
        <div class="card" style="margin-top:16px">
          <div class="card-label">Full review</div>
          <h2 style="font-size:1.05rem">Every exam question</h2>
          ${answers.map((answer, index) => `
            <div style="padding:14px 0;border-bottom:1px solid var(--border)">
              <div style="display:flex;gap:10px;align-items:flex-start">
                <div style="font-size:1.05rem;color:${answer.isRight ? 'var(--green)' : 'var(--red)'}">${answer.isRight ? '✓' : '✕'}</div>
                <div>
                  <p style="color:var(--text);margin-bottom:6px"><strong>Q${index + 1}.</strong> ${answer.q.q}</p>
                  <p>${answer.unanswered ? 'No answer submitted.' : `Your answer: ${answer.q.choices[answer.chosen]}`}</p>
                  ${!answer.isRight ? `<p style="color:var(--green)">Correct answer: ${answer.q.choices[answer.correct]}</p>` : ''}
                  <p>${answer.q.explain}</p>
                </div>
              </div>
            </div>`).join('')}
        </div>`;
    }

    renderHome();
  </script>
</body>
</html>
