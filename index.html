<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive study app that turns your class files into a custom Learn, Reference, Practice, and Exam Sprint experience with gamified progression.">
  <meta name="theme-color" content="#0f1117">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Study Pack Arena">
  <meta property="og:description" content="Turn lecture slides, notes, and class files into a custom study pack with learn cards, reference sheets, drills, and timed exam prep.">
  <meta property="og:url" content="https://physics-study-bot.vercel.app">
  <meta property="og:image" content="https://physics-study-bot.vercel.app/assets/social-preview.png">
  <meta property="og:image:alt" content="Study Pack Arena dashboard showing the study planner and progression system.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Study Pack Arena">
  <meta name="twitter:description" content="Gamified study prep that rebuilds itself from your own class materials.">
  <meta name="twitter:image" content="https://physics-study-bot.vercel.app/assets/social-preview.png">
  <link rel="canonical" href="https://physics-study-bot.vercel.app">
  <link rel="icon" href="data:,">
  <title>Study Pack Arena</title>
  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #23263a;
      --border: #2e3250;
      --accent: #6c7aff;
      --accent2: #a78bfa;
      --green: #34d399;
      --red: #f87171;
      --yellow: #fbbf24;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    /* ── LAYOUT ── */
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky; top: 0; z-index: 100;
    }
    header h1 { font-size: 1rem; font-weight: 600; color: var(--accent); }
    header h1 span { color: var(--text-dim); font-weight: 400; }
    main { flex: 1; padding: 18px 16px 24px; max-width: 1360px; margin: 0 auto; width: 100%; }

    /* ── NAV TABS ── */
    .nav-tabs {
      display: flex; gap: 4px;
      background: var(--surface2);
      border-radius: 10px; padding: 4px;
    }
    .nav-tab {
      flex: 1; padding: 8px 12px; border: none; border-radius: 8px;
      background: transparent; color: var(--text-dim);
      cursor: pointer; font-size: 0.85rem; font-weight: 500;
      transition: all 0.15s;
    }
    .nav-tab:hover { color: var(--text); background: var(--surface); }
    .nav-tab.active { background: var(--accent); color: #fff; }

    /* ── CARDS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .card + .card { margin-top: 16px; }
    .card-label {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
    }
    .card h2 { font-size: 1.4rem; margin-bottom: 12px; }
    .card p { color: var(--text-dim); margin-bottom: 10px; }
    .card p:last-child { margin-bottom: 0; }

    /* ── PROGRESS BAR ── */
    .progress-wrap { margin-bottom: 24px; }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 0.8rem; color: var(--text-dim); margin-bottom: 6px;
    }
    .progress-bar {
      height: 6px; background: var(--surface2);
      border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px; transition: width 0.3s ease;
    }
    .progress-fill.hot { background: linear-gradient(90deg, #fb7185, #f59e0b); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 8px; border: none;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(212,175,55,0.72);
      border-radius: 0 0 18px 18px;
      background:
        radial-gradient(circle at top center, rgba(56,189,248,0.18), transparent 42%),
        linear-gradient(180deg, rgba(13,37,57,0.98), rgba(8,23,39,0.98));
      color: #fef3c7;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 800;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 0 0 1px rgba(34,211,238,0.14),
        0 10px 24px rgba(3,12,24,0.28),
        0 0 24px rgba(34,211,238,0.14);
      clip-path: polygon(7% 0%, 93% 0%, 100% 34%, 94% 100%, 6% 100%, 0% 34%);
    }
    .btn-primary::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.08) 48%, transparent 72%);
      transform: translateX(-85%);
      transition: transform 0.22s ease;
      pointer-events: none;
    }
    .btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 0 1px rgba(34,211,238,0.2),
        0 14px 28px rgba(3,12,24,0.32),
        0 0 30px rgba(34,211,238,0.22);
    }
    .btn-primary:hover::before {
      transform: translateX(12%);
    }
    .btn-secondary {
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-success { background: var(--green); color: #0f2a1e; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .btn-match {
      min-width: 220px;
      justify-content: center;
      padding: 14px 24px;
      font-size: 0.98rem;
      letter-spacing: 0.12em;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 0 1px rgba(34,211,238,0.18),
        0 18px 36px rgba(3,12,24,0.34),
        0 0 36px rgba(34,211,238,0.2);
    }
    .queue-pop-overlay {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(15,23,42,0.62), rgba(2,6,23,0.92)),
        linear-gradient(180deg, rgba(2,6,23,0.32), rgba(2,6,23,0.85));
      backdrop-filter: blur(8px);
    }
    .queue-pop-shell {
      width: min(560px, 100%);
      aspect-ratio: 1 / 1;
      position: relative;
      display: grid;
      place-items: center;
    }
    .queue-pop-ring,
    .queue-pop-ring::before,
    .queue-pop-ring::after {
      border-radius: 999px;
      position: absolute;
      inset: 0;
      content: "";
    }
    .queue-pop-ring {
      border: 2px solid rgba(212,175,55,0.55);
      box-shadow:
        0 0 0 1px rgba(22,163,255,0.12),
        0 0 40px rgba(34,211,238,0.22),
        inset 0 0 70px rgba(8,47,73,0.45);
      background: radial-gradient(circle at center, rgba(15,23,42,0.96), rgba(2,6,23,0.92));
      overflow: hidden;
    }
    .queue-pop-ring::before {
      inset: 18px;
      border: 2px solid rgba(34,211,238,0.72);
      mask: conic-gradient(from 160deg, transparent 0deg 48deg, #000 52deg 320deg, transparent 324deg 360deg);
      -webkit-mask: conic-gradient(from 160deg, transparent 0deg 48deg, #000 52deg 320deg, transparent 324deg 360deg);
      box-shadow: 0 0 24px rgba(34,211,238,0.8), inset 0 0 14px rgba(34,211,238,0.36);
    }
    .queue-pop-ring::after {
      inset: 32px;
      border: 1px solid rgba(212,175,55,0.28);
      background:
        radial-gradient(circle at center, rgba(56,189,248,0.08), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 45%, rgba(0,0,0,0.28));
    }
    .queue-pop-core {
      position: relative;
      z-index: 1;
      width: min(74%, 360px);
      text-align: center;
      display: grid;
      gap: 12px;
      justify-items: center;
    }
    .queue-pop-icon {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      border: 1px solid rgba(212,175,55,0.5);
      background:
        radial-gradient(circle at 50% 34%, rgba(255,255,255,0.18), transparent 38%),
        linear-gradient(180deg, rgba(13,24,42,0.95), rgba(5,10,18,0.96));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 28px rgba(34,211,238,0.18);
      clip-path: polygon(22% 0%, 82% 0%, 100% 18%, 100% 78%, 78% 100%, 18% 100%, 0% 82%, 0% 22%);
      font-size: 2rem;
      font-weight: 900;
      color: #f8fafc;
    }
    .queue-pop-label {
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(226,232,240,0.7);
    }
    .queue-pop-title {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fef3c7;
      text-shadow: 0 0 24px rgba(251,191,36,0.15);
    }
    .queue-pop-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      color: rgba(226,232,240,0.78);
      font-size: 0.84rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .queue-pop-copy {
      color: var(--text-dim);
      font-size: 0.92rem;
    }
    .queue-pop-urgency {
      position: relative;
      z-index: 1;
      width: min(72%, 320px);
      margin-top: 2px;
      display: grid;
      gap: 8px;
      justify-items: center;
    }
    .queue-pop-urgency-copy {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(248,250,252,0.72);
    }
    .queue-pop-urgency-track {
      position: relative;
      width: 100%;
      height: 14px;
      border-radius: 999px;
      border: 1px solid rgba(212,175,55,0.3);
      background: linear-gradient(180deg, rgba(8,23,39,0.95), rgba(4,11,20,0.98));
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 0 18px rgba(34,211,238,0.12);
    }
    .queue-pop-urgency-fill {
      position: absolute;
      inset: 0;
      width: 100%;
      transform-origin: left center;
      background: linear-gradient(90deg, rgba(56,189,248,0.92), rgba(125,211,252,0.85) 35%, rgba(250,204,21,0.88) 78%, rgba(251,113,133,0.86));
      box-shadow: 0 0 20px rgba(56,189,248,0.28);
      animation: queueWindowDrain 5.6s linear forwards;
    }
    .queue-pop-urgency-glow {
      position: absolute;
      top: 50%;
      left: -20%;
      width: 36%;
      height: 180%;
      transform: translateY(-50%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
      mix-blend-mode: screen;
      filter: blur(6px);
      opacity: 0.9;
      animation: queueUrgencySweep 5.6s ease-out forwards;
      pointer-events: none;
    }
    .queue-pop-urgency-ends {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(148,163,184,0.9);
    }
    .queue-pop-actions {
      position: absolute;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 12px;
      width: min(72%, 300px);
    }
    .queue-accept-btn {
      width: 100%;
      padding: 15px 18px;
      border: 2px solid rgba(212,175,55,0.72);
      border-radius: 0 0 22px 22px;
      background:
        linear-gradient(180deg, rgba(11,33,49,0.96), rgba(7,21,34,0.98)),
        linear-gradient(90deg, rgba(34,211,238,0.12), rgba(212,175,55,0.1));
      color: #fef3c7;
      font-size: 1.02rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 0 0 1px rgba(34,211,238,0.18),
        0 0 26px rgba(34,211,238,0.12);
      clip-path: polygon(8% 0%, 92% 0%, 100% 28%, 94% 100%, 6% 100%, 0% 28%);
      transition: transform 0.16s ease, filter 0.16s ease, box-shadow 0.16s ease;
    }
    .queue-accept-btn:hover {
      transform: translateY(-2px) scale(1.01);
      filter: brightness(1.08);
      box-shadow:
        0 0 0 1px rgba(34,211,238,0.26),
        0 0 34px rgba(34,211,238,0.22);
    }
    .queue-decline-btn {
      border: 1px solid rgba(212,175,55,0.4);
      background: rgba(17,24,39,0.88);
      color: rgba(226,232,240,0.82);
      padding: 9px 18px;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    @keyframes queueWindowDrain {
      0% { transform: scaleX(1); filter: saturate(1); }
      70% { transform: scaleX(0.34); filter: saturate(1.1); }
      100% { transform: scaleX(0); filter: saturate(1.25); }
    }
    @keyframes queueUrgencySweep {
      0% { left: -24%; opacity: 0.35; }
      18% { opacity: 0.95; }
      100% { left: 96%; opacity: 0.18; }
    }

    /* ── GAME LAYER ── */
    .hero-panel {
      position: relative;
      overflow: hidden;
      padding: 18px;
      background:
        radial-gradient(circle at top left, rgba(108,122,255,0.18), transparent 34%),
        radial-gradient(circle at bottom right, rgba(251,191,36,0.12), transparent 30%),
        var(--surface);
    }
    .hero-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.03) 48%, transparent 100%);
      pointer-events: none;
    }
    .hud-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .hud-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      min-width: 0;
    }
    .hud-value {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
    }
    .hud-meta {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .xp-track {
      height: 8px;
      margin-top: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
    }
    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #34d399, #6c7aff);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .mission-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .mission-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .mission-card strong { display: block; margin-bottom: 6px; }
    .focus-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: linear-gradient(135deg, rgba(108,122,255,0.12), rgba(251,191,36,0.1));
      border: 1px solid rgba(108,122,255,0.25);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .focus-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent2);
      margin-bottom: 4px;
    }
    .focus-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }
    .focus-metrics {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .metric-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.78rem;
    }
    .metric-pill.hot {
      color: #ffd166;
      border-color: rgba(251,191,36,0.3);
      background: rgba(251,191,36,0.08);
    }
    .achievement-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .achievement {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface2);
      font-size: 0.78rem;
      color: var(--text-dim);
    }
    .achievement.unlocked {
      color: #ffe8a3;
      border-color: rgba(251,191,36,0.35);
      background: rgba(251,191,36,0.08);
    }
    .boss-tag {
      color: #ffd166;
      border-color: rgba(251,191,36,0.4);
      background: rgba(251,191,36,0.08);
    }

    /* ── FORMULA BOX ── */
    .formula {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      margin: 12px 0;
      color: var(--accent2);
    }

    /* ── ANALOGY BOX ── */
    .analogy {
      background: var(--surface2);
      border-radius: 8px; padding: 14px 16px;
      border-left: 3px solid var(--yellow);
      margin: 12px 0;
    }
    .analogy-label {
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--yellow); margin-bottom: 4px;
    }

    /* ── ANSWER CHOICES ── */
    .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .choice {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      color: var(--text);
      font-size: 0.95rem;
    }
    .choice:hover { border-color: var(--accent); }
    .choice.correct { border-color: var(--green); background: rgba(52,211,153,0.1); color: var(--green); }
    .choice.wrong { border-color: var(--red); background: rgba(248,113,113,0.1); color: var(--red); }
    .choice.reveal-correct { border-color: var(--green); background: rgba(52,211,153,0.08); }
    .choice:disabled, .choice.locked { pointer-events: none; }

    /* ── EXPLANATION BOX ── */
    .explanation {
      background: var(--surface2);
      border-radius: 8px; padding: 14px 16px;
      border-left: 3px solid var(--green);
      margin-top: 16px; display: none;
    }
    .explanation.wrong-exp { border-left-color: var(--red); }
    .explanation.show { display: block; }
    .explanation-label {
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--green); margin-bottom: 6px;
    }
    .explanation.wrong-exp .explanation-label { color: var(--red); }

    /* ── SCORE BADGE ── */
    .score-badge {
      display: inline-flex; flex-direction: column; align-items: center;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 32px;
      margin: 16px 0;
    }
    .score-num {
      font-size: 3rem; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .score-label { font-size: 0.85rem; color: var(--text-dim); margin-top: 4px; }

    /* ── TOPIC PILL ── */
    .topic-pill {
      display: inline-block;
      padding: 2px 10px; border-radius: 99px;
      font-size: 0.75rem; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-dim); margin-bottom: 12px;
    }

    /* ── FORMULA SHEET SIDEBAR ── */
    .exam-layout { display: flex; gap: 20px; align-items: flex-start; }
    .exam-main { flex: 1; min-width: 0; }
    .formula-sheet {
      width: 240px; flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      position: sticky; top: 76px;
    }
    .formula-sheet h3 {
      font-size: 0.8rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--accent); margin-bottom: 12px;
    }
    .formula-sheet .f {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem; color: var(--accent2);
      line-height: 1.8;
    }
    .formula-sheet hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

          state.savedPacks = [{ ...parsed, id: parsed.id || `pack-${Date.now()}`, createdAt: parsed.createdAt || new Date().toISOString() }];
        }
      }
    } catch (error) {
      state.savedPacks = [];
    }
    try {
      const activePackId = localStorage.getItem(ACTIVE_PACK_ID_KEY);
      const legacyMode = localStorage.getItem(PACK_MODE_KEY);
      if (activePackId) state.activePackId = activePackId;
      else if (legacyMode === 'custom' && state.savedPacks[0]) state.activePackId = state.savedPacks[0].id;
    } catch (error) {
      state.activePackId = 'default';
    }

    function saveWeakTopics() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.weakTopics));
      } catch (error) {
        // Ignore storage failures in offline/private browsing contexts.
      }
    }
    function saveProfile() {
      try {
        localStorage.setItem(PROFILE_KEY, JSON.stringify(state.profile));
      } catch (error) {
        // Ignore storage failures.
      }
    }

    function saveCustomPackState() {
      try {
        localStorage.setItem(SAVED_PACKS_KEY, JSON.stringify(state.savedPacks));
        localStorage.setItem(ACTIVE_PACK_ID_KEY, state.activePackId);
        const activeCustom = state.savedPacks.find((pack) => pack.id === state.activePackId);
        if (activeCustom) localStorage.setItem(CUSTOM_PACK_KEY, JSON.stringify(activeCustom));
        else localStorage.removeItem(CUSTOM_PACK_KEY);
        localStorage.setItem(PACK_MODE_KEY, state.activePackId === 'default' ? 'default' : 'custom');
      } catch (error) {
        // Ignore storage failures.
      }
    }

    function getActiveStudyPack() {
      if (state.activePackId === 'default') return DEFAULT_STUDY_PACK;
      return state.savedPacks.find((pack) => pack.id === state.activePackId) || DEFAULT_STUDY_PACK;
    }

    function getConcepts() {
      return getActiveStudyPack().concepts || [];
    }

    function getFormulas() {
      return getActiveStudyPack().formulas || [];
    }

    function getQuestions() {
      return getActiveStudyPack().questions || [];
    }

    function getPackLabel() {
      return state.activePackId === 'default' ? 'Built-in Pack Active' : 'Uploaded Pack Active';
    }

    function getPackScopeText(pack = getActiveStudyPack()) {
      return (pack.scope && pack.scope.length ? pack.scope : ['Focused study scope']).join(' • ');
    }

    function syncHeaderTitle() {
      const pack = getActiveStudyPack();
      const title = document.getElementById('app-title');
      if (!title) return;
      const scopeLabel = pack.scope && pack.scope.length
        ? pack.scope.slice(0, 2).join(' + ')
        : 'Focused Scope';
      title.innerHTML = `⚡ Study Pack Arena <span>— ${pack.title || scopeLabel}</span>`;
    }

    function activateCustomPack(studyPack) {
      const packId = studyPack.id || `pack-${Date.now()}`;
      const normalizedPack = {
        ...studyPack,
        id: packId,
        createdAt: studyPack.createdAt || new Date().toISOString(),
      };
      const existingIndex = state.savedPacks.findIndex((pack) => pack.id === packId || pack.title === normalizedPack.title);
      if (existingIndex >= 0) state.savedPacks[existingIndex] = { ...state.savedPacks[existingIndex], ...normalizedPack };
      else state.savedPacks.unshift(normalizedPack);
      state.activePackId = normalizedPack.id;
      state.recentPackAnnouncement = normalizedPack.title;
      state.learnIndex = 0;
      state.formulaIndex = 0;
      state.scopeStudio.previewPack = null;
      saveCustomPackState();
      syncHeaderTitle();
    }

    function activatePack(packId) {
      state.activePackId = packId;
      state.recentPackAnnouncement = getActiveStudyPack().title;
      saveCustomPackState();
      syncHeaderTitle();
      goHome();
    }

    function resetToDefaultPack() {
      state.activePackId = 'default';
      state.recentPackAnnouncement = DEFAULT_STUDY_PACK.title;
      saveCustomPackState();
      syncHeaderTitle();
      goHome();
    }

    function getSavedPacks() {
      return state.savedPacks;
    }

    function getPackSwitcherOptions() {
      return [
        { id: 'default', title: DEFAULT_STUDY_PACK.title, subtitle: DEFAULT_STUDY_PACK.subtitle },
        ...getSavedPacks(),
      ];
    }

    function selectPack(packId) {
      if (packId === 'default') {
        resetToDefaultPack();
        return;
      }
      activatePack(packId);
    }

    function renameSavedPack(packId) {
      const pack = state.savedPacks.find((item) => item.id === packId);
      if (!pack) return;
      const nextTitle = window.prompt('Rename this study pack:', pack.title || '');
      if (!nextTitle) return;
      pack.title = nextTitle.trim().slice(0, 120) || pack.title;
      if (state.activePackId === packId) state.recentPackAnnouncement = pack.title;
      saveCustomPackState();
      renderScopeStudio();
    }

    function deleteSavedPack(packId) {
      const pack = state.savedPacks.find((item) => item.id === packId);
      if (!pack) return;
      const confirmed = window.confirm(`Delete "${pack.title}" from this browser?`);
      if (!confirmed) return;
      state.savedPacks = state.savedPacks.filter((item) => item.id !== packId);
      if (state.activePackId === packId) {
        state.activePackId = 'default';
        state.recentPackAnnouncement = DEFAULT_STUDY_PACK.title;
      }
      saveCustomPackState();
      syncHeaderTitle();
      renderScopeStudio();
    }

    function buildPackSwitcherPanel(contextLabel = 'Choose active pack') {
      const packs = getPackSwitcherOptions();
      return `
        <div class="pack-switcher-panel">
          <div class="card-label">${escapeHtml(contextLabel)}</div>
          <div class="pack-switcher-row">
            <select class="pack-switcher-select" onchange="selectPack(this.value)">
              ${packs.map((pack) => `
                <option value="${escapeHtml(pack.id)}" ${pack.id === state.activePackId ? 'selected' : ''}>
                  ${escapeHtml(pack.id === 'default' ? 'Built-in Starter Pack' : pack.title)}
                </option>
              `).join('')}
            </select>
            <div class="pack-switcher-or">OR</div>
            <button class="btn btn-primary" onclick="goMode('scope')">Create New Pack</button>
          </div>
          <div class="pack-switcher-note">
            ${state.activePackId === 'default'
              ? 'You are on the built-in starter pack. Choose a saved pack or create a new one for another class.'
              : `You are currently studying "${escapeHtml(getActiveStudyPack().title)}". Switch here anytime or create a fresh pack.`}
          </div>

    }

    function acceptPreviewPack() {
      if (!state.scopeStudio.previewPack) return;
      const preview = state.scopeStudio.previewPack;
      activateCustomPack(preview);
      state.scopeStudio.success = `${preview.title} is now active.`;
      goHome();
    }

    function discardPreviewPack() {
      state.scopeStudio.previewPack = null;
      state.scopeStudio.success = 'Draft pack discarded. Your active pack did not change.';
      renderScopeStudio();
    }

    function getTierIndex(xp = state.profile.xp) {
      let index = 0;
      for (let i = 0; i < RANK_TIERS.length; i += 1) {
        if (xp >= RANK_TIERS[i].minXp) index = i;
      }
      return index;
    }

    function getLevelInfo() {
      const index = getTierIndex();
      const tier = RANK_TIERS[index];
      const nextTier = RANK_TIERS[index + 1] || null;
      const current = state.profile.xp - tier.minXp;
      const needed = nextTier ? nextTier.minXp - tier.minXp : 220;
      const pct = nextTier ? ((state.profile.xp - tier.minXp) / (nextTier.minXp - tier.minXp)) * 100 : 100;
      return {
        level: index + 1,
        tier,
        tierIndex: index,
        nextTier,
        current,
        needed,
        pct,
        xpIntoTier: current,
        xpToNext: nextTier ? nextTier.minXp - state.profile.xp : 0,
      };
    }

    function getAccuracyPct() {
      if (!state.profile.totalAnswered) return 0;
      return Math.round((state.profile.totalCorrect / state.profile.totalAnswered) * 100);
    }

    function getFlowLabel() {
      if (state.currentStreak >= 10) return 'Closing Out';
      if (state.currentStreak >= 6) return 'Snowballing';
      if (state.currentStreak >= 3) return 'Winning Lane';
      return 'Warm-up';
    }

    function getComboMultiplier() {
      return 1 + Math.min(1.1, state.currentStreak * 0.08);
    }

    function isBossRound(index) {
      return (index + 1) % 5 === 0;
    }

    function getRankBenefits() {
      const tierKey = getLevelInfo().tier.key;
      const table = {
        iron: { rerolls: 0, shields: 0, bossMultiplier: 1, rematchBank: 1 },
        bronze: { rerolls: 1, shields: 0, bossMultiplier: 1, rematchBank: 1 },
        silver: { rerolls: 1, shields: 0, bossMultiplier: 1, rematchBank: 2 },
        gold: { rerolls: 1, shields: 1, bossMultiplier: 1.15, rematchBank: 2 },
        emerald: { rerolls: 2, shields: 1, bossMultiplier: 1.2, rematchBank: 2 },
        diamond: { rerolls: 2, shields: 2, bossMultiplier: 1.3, rematchBank: 2 },
        master: { rerolls: 3, shields: 2, bossMultiplier: 1.45, rematchBank: 2 },
        challenger: { rerolls: 4, shields: 2, bossMultiplier: 1.6, rematchBank: 3 },
      };
      return table[tierKey] || table.iron;
    }

    function emitSoundHook(type, detail = {}) {
      document.dispatchEvent(new CustomEvent('studybot:sound-hook', {
        detail: {
          type,
          ...detail,
        },
      }));
    }

    function getQuestionBankQuality(questionCount) {
      if (questionCount >= 32) return { label: 'Ranked-ready', pct: 100 };
      if (questionCount >= 24) return { label: 'Strong', pct: 76 };
      if (questionCount >= 16) return { label: 'Playable', pct: 52 };
      return { label: 'Thin', pct: 28 };
    }

    function getCoverageQuality(pack) {
      const conceptTopics = [...new Set((pack.concepts || []).map((item) => item.topic).filter(Boolean))];
      const questionTopics = new Set((pack.questions || []).map((item) => item.topic).filter(Boolean));
      if (!conceptTopics.length) {
        return { label: 'Unknown', pct: 0, covered: 0, total: 0, hardFail: false };
      }
      const covered = conceptTopics.filter((topic) => questionTopics.has(topic)).length;
      const pct = Math.round((covered / conceptTopics.length) * 100);
      return {
        label: pct >= 85 ? 'Broad' : pct >= 60 ? 'Decent' : 'Patchy',
        pct,
        covered,
        total: conceptTopics.length,
        hardFail: pct < 55,
      };
    }

function initSoundHooks() {
      if (window.__studyBotSoundHooksReady) return;
      window.__studyBotSoundHooksReady = true;

      const ensureAudioCtx = async () => {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        const ctx = window.__studyBotAudioCtx || new AudioCtx();
        window.__studyBotAudioCtx = ctx;
        if (ctx.state === 'suspended') {
          try {
            await ctx.resume();
          } catch (error) {
            return null;
          }
        }
        return ctx;
      };

      const unlockOnGesture = () => {
        ensureAudioCtx().then((ctx) => {
          [
            getHostedAudio('__studyBotQueueAudio', QUEUE_POP_AUDIO_URL),
            getHostedAudio('__studyBotAcceptAudio', ACCEPT_MATCH_AUDIO_URL),
            getHostedAudio('__studyBotCorrectAudio', CORRECT_ANSWER_AUDIO_URL),
            getHostedAudio('__studyBotWrongAudio', WRONG_ANSWER_AUDIO_URL),
            getHostedAudio('__studyBotStreakFiveAudio', STREAK_FIVE_AUDIO_URL),
            getHostedAudio('__studyBotRankUpAudio', RANK_UP_AUDIO_URL),
          ].filter(Boolean).forEach((audio) => {
            try {
              audio.load();
            } catch (error) {}
          });
          if (ctx) {
            [
              ['queue-pop', QUEUE_POP_AUDIO_URL],
              ['queue-accept', ACCEPT_MATCH_AUDIO_URL],
              ['answer-correct', CORRECT_ANSWER_AUDIO_URL],
              ['answer-wrong', WRONG_ANSWER_AUDIO_URL],
              ['streak-five', STREAK_FIVE_AUDIO_URL],
              ['rank-up', RANK_UP_AUDIO_URL],
            ].forEach(([key, url]) => {
              primeAudioBuffer(key, url);
            });
          }
        }).finally(() => {
          window.removeEventListener('pointerdown', unlockOnGesture, true);
          window.removeEventListener('keydown', unlockOnGesture, true);
        });
      };

      window.addEventListener('pointerdown', unlockOnGesture, true);
      window.addEventListener('keydown', unlockOnGesture, true);

      const getHostedAudio = (cacheKey, url) => {
        if (!url) return null;
        if (!window[cacheKey]) {
          const audio = new Audio(url);
          audio.preload = 'auto';
          audio.playsInline = true;
          audio.crossOrigin = 'anonymous';
          window[cacheKey] = audio;
        }
        return window[cacheKey];
      };

      const primeAudioBuffer = async (key, url) => {
        if (!key || !url) return null;
        const ctx = window.__studyBotAudioCtx;
        if (!ctx || window.__studyBotAudioBuffers?.[key] || window.__studyBotAudioBufferPromises?.[key]) return window.__studyBotAudioBuffers?.[key] || null;
        window.__studyBotAudioBuffers ||= {};
        window.__studyBotAudioBufferPromises ||= {};
        window.__studyBotAudioBufferPromises[key] = fetch(url)
          .then((response) => response.arrayBuffer())
          .then((buffer) => ctx.decodeAudioData(buffer.slice(0)))
          .then((decoded) => {
            window.__studyBotAudioBuffers[key] = decoded;
            delete window.__studyBotAudioBufferPromises[key];
            return decoded;
          })
          .catch(() => {
            delete window.__studyBotAudioBufferPromises[key];
            return null;
          });
        return window.__studyBotAudioBufferPromises[key];
      };

      const stopBufferedAudio = (key) => {
        const active = window.__studyBotActiveSources?.[key];
        if (!active) return;
        try {
          active.source.stop(0);
        } catch (error) {}
        try {
          active.source.disconnect();
          active.gain.disconnect();
        } catch (error) {}
        delete window.__studyBotActiveSources[key];
      };

      const playBufferedAudio = (key, url, volume = 0.65) => {
        const ctx = window.__studyBotAudioCtx;
        const buffer = window.__studyBotAudioBuffers?.[key];
        if (!ctx || ctx.state !== 'running' || !buffer) {
          if (url) primeAudioBuffer(key, url);
          return false;
        }
        window.__studyBotActiveSources ||= {};
        stopBufferedAudio(key);
        const source = ctx.createBufferSource();
        const gainNode = ctx.createGain();
        gainNode.gain.setValueAtTime(volume, ctx.currentTime);
        source.buffer = buffer;
        source.connect(gainNode);
        gainNode.connect(ctx.destination);
        source.start(0);
        window.__studyBotActiveSources[key] = { source, gain: gainNode };
        source.onended = () => {
          if (window.__studyBotActiveSources?.[key]?.source === source) {
            delete window.__studyBotActiveSources[key];
          }
        };
        return true;
      };

      const playHostedAudio = (audio, volume = 0.65) => {
        if (!audio) return false;
        try {
          audio.pause();
          audio.currentTime = 0;
          audio.volume = volume;
          const playPromise = audio.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
          }
          return true;
        } catch (error) {
          return false;
        }
      };

      window.__studyBotStopHostedAudio = (audio) => {
        if (!audio) return;
        try {
          audio.pause();
          audio.currentTime = 0;
        } catch (error) {}
      };

      window.__studyBotStopSound = (key) => {
        stopBufferedAudio(key);
        const hostedAudioMap = {
          'queue-pop': window.__studyBotQueueAudio,
          'answer-correct': window.__studyBotCorrectAudio,
          'answer-wrong': window.__studyBotWrongAudio,
          'streak-five': window.__studyBotStreakFiveAudio,
          'rank-up': window.__studyBotRankUpAudio,
        };
        window.__studyBotStopHostedAudio(hostedAudioMap[key]);
      };

      const playCue = (detail = {}) => {
        if (detail.type === 'queue-pop') {
          if (playBufferedAudio('queue-pop', QUEUE_POP_AUDIO_URL, 0.72)) {
            return;
          }
          const queueAudio = getHostedAudio('__studyBotQueueAudio', QUEUE_POP_AUDIO_URL);
          if (playHostedAudio(queueAudio, 0.65)) {
            return;
          }
        }

        if (detail.type === 'queue-accept') {
          if (playBufferedAudio('queue-accept', ACCEPT_MATCH_AUDIO_URL, 0.78)) {
            return;
          }
          const acceptAudio = getHostedAudio('__studyBotAcceptAudio', ACCEPT_MATCH_AUDIO_URL);
          if (playHostedAudio(acceptAudio, 0.74)) {
            return;
          }
        }

        if (detail.type === 'answer-submit') {
          const audioKey = detail.result === 'correct' ? 'answer-correct' : 'answer-wrong';
          const audioUrl = detail.result === 'correct' ? CORRECT_ANSWER_AUDIO_URL : WRONG_ANSWER_AUDIO_URL;
          if (playBufferedAudio(audioKey, audioUrl, detail.result === 'correct' ? 0.58 : 0.62)) {
            return;
          }
          const answerAudio = detail.result === 'correct'
            ? getHostedAudio('__studyBotCorrectAudio', CORRECT_ANSWER_AUDIO_URL)
            : getHostedAudio('__studyBotWrongAudio', WRONG_ANSWER_AUDIO_URL);
          if (playHostedAudio(answerAudio, detail.result === 'correct' ? 0.55 : 0.6)) {
            return;
          }
        }

        if (detail.type === 'streak-5') {
          if (playBufferedAudio('streak-five', STREAK_FIVE_AUDIO_URL, 0.66)) {
            return;
          }
          const streakAudio = getHostedAudio('__studyBotStreakFiveAudio', STREAK_FIVE_AUDIO_URL);
          if (playHostedAudio(streakAudio, 0.62)) {
            return;
          }
        }

        if (detail.type === 'rank-promo') {
          if (playBufferedAudio('rank-up', RANK_UP_AUDIO_URL, 0.7)) {
            return;
          }
          const rankUpAudio = getHostedAudio('__studyBotRankUpAudio', RANK_UP_AUDIO_URL);
          if (playHostedAudio(rankUpAudio, 0.68)) {
            return;
          }
        }

        const ctx = window.__studyBotAudioCtx;
        if (!ctx || ctx.state !== 'running') return;

        const now = ctx.currentTime;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(detail.type === 'answer-submit' ? 0.18 : detail.type === 'boss-clear' ? 0.22 : detail.type === 'queue-pop' ? 0.24 : 0.2, now);
        gain.connect(ctx.destination);

        const tones = detail.type === 'answer-submit'
          ? [659.25]
          : detail.type === 'streak-5'
            ? [523.25, 659.25, 783.99]
          : detail.type === 'queue-pop'
            ? [783.99, 987.77, 1174.66]
          : detail.type === 'boss-clear'
            ? [392, 523.25, 659.25]
            : detail.tier === 'challenger'
              ? [440, 554.37, 739.99]
              : detail.tier === 'master'
                ? [392, 493.88, 659.25]
                : [329.63, 392, 523.25];

        tones.forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const oscGain = ctx.createGain();
          osc.type = detail.type === 'answer-submit' ? 'sine' : detail.type === 'boss-clear' || detail.type === 'queue-pop' ? 'triangle' : 'sawtooth';
          osc.frequency.setValueAtTime(freq, now + index * 0.08);
          oscGain.gain.setValueAtTime(0.0001, now + index * 0.08);
          oscGain.gain.exponentialRampToValueAtTime(detail.type === 'answer-submit' ? 0.12 : detail.type === 'boss-clear' ? 0.16 : detail.type === 'queue-pop' ? 0.14 : 0.18, now + index * 0.08 + 0.01);
          oscGain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.08 + (detail.type === 'answer-submit' ? 0.2 : detail.type === 'queue-pop' ? 0.34 : 0.26));
          osc.connect(oscGain);
          oscGain.connect(gain);
          osc.start(now + index * 0.08);
          osc.stop(now + index * 0.08 + (detail.type === 'answer-submit' ? 0.22 : detail.type === 'queue-pop' ? 0.36 : 0.28));
        });
      };

      document.addEventListener('studybot:sound-hook', (event) => {
        playCue(event.detail || {});
      });
    }

    function buildRankShowcase(level) {
      const currentIndex = getTierIndex();
      const currentTier = level.tier;
      const nextTier = level.nextTier;
      const currentRewardLabel = currentTier.perks[0];
      const nextRewardLabel = nextTier ? nextTier.perks[0] : 'No higher reward gate left';
      return `
        <section class="rank-showcase">
          <div class="rank-showcase-head">
            <div>

    function applyAnswerOutcome({ isRight, mode, elapsedMs, bossRound }) {
      state.rewardBursts = [];
      state.profile.totalAnswered += 1;
      let gainedXp = 0;
      let rankPromo = null;

      if (isRight) {
        const tierBefore = getTierIndex();
        state.currentStreak += 1;
        state.profile.totalCorrect += 1;
        state.profile.bestStreak = Math.max(state.profile.bestStreak, state.currentStreak);

        const benefits = getRankBenefits();
        const base = mode === 'exam' ? 20 : 14;
        const speedBonus = elapsedMs <= 8000 ? 9 : elapsedMs <= 12000 ? 6 : elapsedMs <= 20000 ? 3 : 0;
        const comboBonus = Math.round(base * Math.max(0, getComboMultiplier() - 1) * 0.6);
        const bossBonus = bossRound ? Math.round(10 * benefits.bossMultiplier) : 0;
        const surgeRoll = Math.random();
        const surgeBonus = surgeRoll > 0.97 ? 10 : surgeRoll > 0.88 ? 5 : surgeRoll > 0.68 ? 2 : 0;
        gainedXp = base + speedBonus + comboBonus + bossBonus + surgeBonus;

        state.rewardBursts.push(`+${base} XP clean clear`);
        if (speedBonus) state.rewardBursts.push(`+${speedBonus} power spike`);
        if (comboBonus) state.rewardBursts.push(`+${comboBonus} snowball`);
        if (bossBonus) state.rewardBursts.push(`+${bossBonus} bounty`);
        if (surgeBonus) state.rewardBursts.push(`+${surgeBonus} heater`);

        if (state.currentStreak === 5) emitSoundHook('streak-5', { streak: 5 });
        if (state.currentStreak >= 5) unlockAchievement('streak_5');
        if (state.currentStreak >= 10) unlockAchievement('streak_10');
        if (elapsedMs <= 12000) {
          state.profile.fastAnswers = (state.profile.fastAnswers || 0) + 1;
          if (state.profile.fastAnswers >= 3) unlockAchievement('speed_3');
        }

        EARLY_REWARD_TABLE.forEach((reward) => {
          if (reward.test()) {
            gainedXp += reward.xp;
            state.rewardBursts.push(`+${reward.xp} ${reward.label}`);
          }
        });

        state.profile.xp += gainedXp;
        const tierAfter = getTierIndex();
        if (tierAfter > tierBefore) {
          rankPromo = RANK_TIERS[tierAfter];
          state.rankPromoToast = rankPromo;
          state.promoFlashKey = rankPromo.key;
          emitSoundHook('rank-promo', { tier: rankPromo.key, soundCue: `promo-${rankPromo.key}` });
          state.rewardBursts.unshift(`${rankPromo.name} reached`);
        }
      } else {
        if (state.sessionShieldLeft > 0) {
          state.sessionShieldLeft -= 1;
          state.rewardBursts.push('Streak shield burned');
        } else {
          state.currentStreak = 0;
          state.rewardBursts.push('Streak reset');
        }
      }

      if (!isRight) {
        state.profile.xp += gainedXp;
      }
      state.sessionXp += gainedXp;
      saveProfile();
      return { gainedXp, rankPromo };
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function scrollTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function paragraphize(text) {
      return text
        .split('\n\n')
        .map((block) => `<p>${block.replace(/\n/g, '<br>')}</p>`)
        .join('');
    }

    function escapeHtml(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatTime(totalSeconds) {
      const safe = Math.max(0, totalSeconds);
      const minutes = Math.floor(safe / 60);
      const seconds = safe % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function getWeakTopics(minWrong = 2) {
      return Object.entries(state.weakTopics)
        .filter(([, wrong]) => wrong >= minWrong)
        .sort((a, b) => b[1] - a[1]);
    }

    function updateScopeStudioField(key, value) {
      state.scopeStudio[key] = value;
      if (key === 'examContext') {
        state.scopeStudio.preparedFingerprint = '';
      }
    }

    function suggestPackName(files) {
      const first = files[0];
      if (!first) return '';
      return String(first.name || '')
        .replace(/\.[^.]+$/, '')
        .replace(/[_-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, 80);
    }

    function formatBytes(bytes) {
      if (bytes >= 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      if (bytes >= 1024) return `${Math.round(bytes / 1024)} KB`;
      return `${bytes} B`;
    }

    function handleStudyFiles(input) {
      const files = Array.from(input.files || []);
      const totalBytes = files.reduce((sum, file) => sum + (file.size || 0), 0);
      state.scopeStudio.error = '';
      state.scopeStudio.success = '';
      state.scopeStudio.previewPack = null;
      state.scopeStudio.preparedMaterials = [];
      state.scopeStudio.preparedFingerprint = '';
      state.scopeStudio.detectedScopes = [];
      state.scopeStudio.sourceSummary = [];
      state.scopeStudio.prepProgress = '';

      if (files.length > MAX_SCOPE_FILES) {
        state.scopeStudio.files = [];
        state.scopeStudio.error = `That upload is too wide. Use up to ${MAX_SCOPE_FILES} files at once, then generate another pack if you need more material.`;
        renderScopeStudio();
        return;
      }

      state.scopeStudio.files = files;
      if (!state.scopeStudio.packName.trim()) {
        state.scopeStudio.packName = suggestPackName(files);
      }
      if (totalBytes > MAX_SCOPE_TOTAL_BYTES) {
        state.scopeStudio.success = `Large batch detected: ${formatBytes(totalBytes)} across ${files.length} files. Bulk prep mode will process the files in smaller steps before generation.`;
      }
      renderScopeStudio();
    }

    function clearScopeStudioMessages() {
      state.scopeStudio.error = '';
      state.scopeStudio.success = '';
    }

    function getPreparationFingerprint() {
      return [
        state.scopeStudio.examContext.trim(),
        ...state.scopeStudio.files.map((file) => `${file.name}:${file.size || 0}:${file.lastModified || 0}`),
      ].join('|');
    }

    async function parseJsonResponse(response, oversizedMessage) {
      const raw = await response.text();
      let payload = null;

      try {
        payload = raw ? JSON.parse(raw) : null;
      } catch (error) {
        if (raw.includes('Request Entity Too Large') || raw.includes('FUNCTION_PAYLOAD_TOO_LARGE')) {
          throw new Error(oversizedMessage);
        }
        throw new Error('The server returned a non-JSON error response.');
      }

      if (!response.ok || !payload?.ok) {
        throw new Error(payload?.error || 'The request failed.');
      }

      return payload;
    }

    function getAttachmentCandidates() {
      return state.scopeStudio.files
        .filter((file) => /\.(pdf|png|jpg|jpeg|webp)$/i.test(file.name))
        .filter((file) => (file.size || 0) <= 1024 * 1024)
        .slice(0, 2);
    }

    async function sendScopeRequest(action = 'generate', preparedMaterials = state.scopeStudio.preparedMaterials) {
      if (!preparedMaterials.length && !state.scopeStudio.files.length) {
        throw new Error('Add at least one file before running the study-pack generator.');
      }

      const formData = new FormData();
      formData.append('action', action);
      formData.append('examContext', state.scopeStudio.examContext || '');
      formData.append('packName', state.scopeStudio.packName.trim() || suggestPackName(state.scopeStudio.files));
      if (preparedMaterials.length) {
        formData.append('materialsJson', JSON.stringify(preparedMaterials));
      }
      getAttachmentCandidates().forEach((file) => formData.append('files', file, file.name));
      if (!preparedMaterials.length && !getAttachmentCandidates().length) {
        state.scopeStudio.files.forEach((file) => formData.append('files', file, file.name));
      }

      const response = await fetch('/api/generate-study-pack', {
        method: 'POST',
        body: formData,
      });
      return parseJsonResponse(
        response,
        `This upload is too large for the server to accept in one shot. Cut it down to the most relevant files and keep the total closer to ${formatBytes(MAX_SCOPE_TOTAL_BYTES)}.`,
      );
    }

    async function prepareMaterialsForGeneration() {
      if (!state.scopeStudio.files.length) {
        throw new Error('Add at least one file before generating a study pack.');
      }

      const fingerprint = getPreparationFingerprint();
      if (
        state.scopeStudio.preparedMaterials.length === state.scopeStudio.files.length &&
        state.scopeStudio.preparedFingerprint === fingerprint
      ) {
        return state.scopeStudio.preparedMaterials;
      }

      const prepared = [];
      const detectedScopes = [];
      const sourceSummary = [];
      state.scopeStudio.busy = 'prepare';

      for (let index = 0; index < state.scopeStudio.files.length; index += 1) {
        const file = state.scopeStudio.files[index];
        state.scopeStudio.prepProgress = `Preparing ${index + 1}/${state.scopeStudio.files.length}: ${file.name}`;
        renderScopeStudio();

        const formData = new FormData();
        formData.append('file', file, file.name);
        formData.append('examContext', state.scopeStudio.examContext || '');

        const response = await fetch('/api/prepare-study-material', {
          method: 'POST',
          body: formData,
        });
        const payload = await parseJsonResponse(
          response,
          `"${file.name}" is too large to prepare in one request. Keep each file under 8 MB.`,
        );

        prepared.push(payload.material);
        (payload.detectedScopes || []).forEach((scope) => {
          if (!detectedScopes.includes(scope)) detectedScopes.push(scope);
        });
        (payload.sourceSummary || []).forEach((item) => sourceSummary.push(item));
      }

      state.scopeStudio.preparedMaterials = prepared;
      state.scopeStudio.preparedFingerprint = fingerprint;
      state.scopeStudio.detectedScopes = detectedScopes;
      state.scopeStudio.sourceSummary = sourceSummary;
      state.scopeStudio.prepProgress = `Prepared ${prepared.length} files for generation.`;
      return prepared;
    }

    async function generateCustomPack() {
      clearScopeStudioMessages();

      try {
        const preparedMaterials = await prepareMaterialsForGeneration();
        state.scopeStudio.busy = 'generate';
        renderScopeStudio();
        const payload = await sendScopeRequest('generate', preparedMaterials);
        state.scopeStudio.previewPack = payload.studyPack;
        state.scopeStudio.detectedScopes = payload.detectedScopes || [];
        state.scopeStudio.sourceSummary = payload.sourceSummary || payload.studyPack.sourceSummary || [];
        state.scopeStudio.success = `Draft ready: ${payload.studyPack.title || 'New pack'}. Review it below, then activate when you want the whole site to switch.`;
        renderScopeStudio();
      } catch (error) {
        state.scopeStudio.error = error.message || 'Could not generate the study pack.';
        renderScopeStudio();
      } finally {
        state.scopeStudio.busy = '';
        state.scopeStudio.prepProgress = '';
      }
    }

    function buildFormulaSheet() {
      const groups = getFormulas().reduce((acc, formula) => {
        (acc[formula.chapter] ||= []).push(formula);
        return acc;
      }, {});

      return `
        <div class="formula-sheet">
          <h3>Reference Sheet</h3>
          ${Object.entries(groups).map(([chapter, formulas]) => `
            <div class="f"><strong>${chapter}</strong><br>${formulas.map((formula) => formula.formula).join('<br>')}</div>
            <hr>
          `).join('')}
        </div>`;
    }

    function clearExamTimer() {
      if (state.examTimerId) {
        clearInterval(state.examTimerId);
        state.examTimerId = null;
      }
    }

    function startExamTimer() {
      clearExamTimer();
      state.examTimerId = setInterval(() => {
        if (state.mode !== 'exam') {
          clearExamTimer();
          return;
        }
        state.examTimeRemaining -= 1;
        if (state.examTimeRemaining <= 0) {
          state.examTimeRemaining = 0;
          clearExamTimer();
          renderExamResults(true);
          return;
        }
        renderExam();
      }, 1000);
    }

    function getTopicStats(items) {
      const stats = {};
      items.forEach((item) => {
        const key = item.q.topic;
        if (!stats[key]) stats[key] = { topic: key, total: 0, correct: 0 };
        stats[key].total += 1;
        if (item.isRight) stats[key].correct += 1;
      });
      return Object.values(stats).sort((a, b) => (a.correct / a.total) - (b.correct / b.total));
    }

    function acceptQueuePop() {

      if (window.__studyBotStopSound) {

      renderQueuePop();

      if (mode === 'practice') {
        startPractice(context?.topicFilter || null, true);
        return;
      }
      if (mode === 'exam') {
        startExam(true);
        return;
      }
      executeMode(mode);

    function executeMode(mode) {
      if (state.mode === 'exam' && mode !== 'exam') clearExamTimer();

      } else if (mode === 'learn') {

      } else if (mode === 'practice') {

      } else if (mode === 'exam') {

      setActiveTab(['home', 'scope', 'learn', 'formulas', 'practice', 'exam'].indexOf(mode));

    function renderLearn() {

              <button class="btn btn-secondary" onclick="goMode('scope')">Open Study Packs</button>
              <button class="btn btn-primary" onclick="goHome()">Back Home</button>
            </div>
          </div>`;

      }

      const concept = concepts[state.learnIndex];
      const total = concepts.length;
      const progress = ((state.learnIndex + 1) / total) * 100;

      document.getElementById('main').innerHTML = `
        <div class="progress-wrap">
          <div class="progress-label"><span>Concept ${state.learnIndex + 1} of ${total}</span><span>${Math.round(progress)}%</span></div>

            <div class="analogy-label">Intuition hook</div>

            <div class="card-label">Explanation</div>

            <div class="card" style="margin-top:16px;background:var(--surface2)">
              <div class="card-label">Core equation</div>
              <div class="formula" style="margin-bottom:8px">${concept.formula}</div>
              <p>${concept.formulaNote || 'Know when to apply this relationship.'}</p>
            </div>` : ''}
          <div class="btn-row">
            <button class="btn btn-secondary" onclick="prevConcept()" ${state.learnIndex === 0 ? 'disabled' : ''}>← Previous</button>

    function prevConcept() {
      if (state.learnIndex > 0) {
        state.learnIndex -= 1;
        renderLearn();
        scrollTop();

    }

    function nextConcept() {
      if (state.learnIndex < getConcepts().length - 1) {
        state.learnIndex += 1;
        renderLearn();
        scrollTop();
      } else {
        goMode('formulas');
      }

    function startPractice(topicFilter = null, bypassQueue = false) {
      if (!bypassQueue) {
        openQueuePop('practice', { topicFilter });
        return;
      }
      const questions = getQuestions();
      const benefits = getRankBenefits();
      if (!questions.length) {
        document.getElementById('main').innerHTML = `
          <div class="card">
            <div class="card-label">Practice</div>
            <h2>No practice questions are available</h2>
            <p>The active pack does not have question data yet. Generate a new pack or switch to the default course pack.</p>
            <div class="btn-row">
              <button class="btn btn-secondary" onclick="goMode('scope')">Open Study Packs</button>
              <button class="btn btn-primary" onclick="goHome()">Back Home</button>
            </div>
          </div>`;
        return;
      }

      const shuffled = shuffle(questions.filter((question) => !topicFilter || question.topic === topicFilter));
      const pool = shuffled.sort((a, b) => (state.weakTopics[b.topic] || 0) - (state.weakTopics[a.topic] || 0));

      if (!pool.length) {
        document.getElementById('main').innerHTML = `
          <div class="card">
            <div class="card-label">Practice</div>
            <h2>No questions matched that drill</h2>
            <p>That topic is not present in the active pack. Try the full pack or generate a tighter study pack.</p>
            <div class="btn-row">
              <button class="btn btn-secondary" onclick="startPractice()">Practice Active Pack</button>
              <button class="btn btn-primary" onclick="goMode('scope')">Adjust Pack</button>
            </div>
          </div>`;
        return;
      }

      state.mode = 'practice';
      state.practiceTopicFilter = topicFilter;
      state.practiceQueue = pool;
      state.practiceIndex = 0;
      state.practiceAnswered = false;
      state.practiceResults = [];
      state.practiceRequeues = {};
      state.practiceDeferred = [];
      state.practiceRerollsLeft = benefits.rerolls;
      state.sessionShieldLeft = benefits.shields;
      state.selectedChoice = null;
      state.sessionXp = 0;
      state.currentStreak = 0;
      state.rewardBursts = [];
      state.rankPromoToast = null;
      state.promoFlashKey = '';
      state.questionStartedAt = Date.now();
      state.profile.sessions += 1;
      saveProfile();
      setActiveTab(4);
      renderPractice();
      scrollTop();
    }

    function renderPractice() {
      syncHeaderTitle();
      if (state.practiceIndex >= state.practiceQueue.length) {
        if (state.practiceDeferred.length) {
          state.practiceQueue = state.practiceQueue.concat(shuffle(state.practiceDeferred));
          state.practiceDeferred = [];
          renderPractice();
          return;
        }
        renderPracticeResults();
        return;
      }

      const question = state.practiceQueue[state.practiceIndex];
      const total = state.practiceQueue.length;
      const progress = ((state.practiceIndex + 1) / total) * 100;
      const weakCount = state.weakTopics[question.topic] || 0;
      const filterPill = state.practiceTopicFilter ? `<span class="topic-pill">Targeted drill</span>` : '';
      const bossRound = isBossRound(state.practiceIndex);

      document.getElementById('main').innerHTML = `
        ${renderGameHud('Practice')}
        <div class="progress-wrap">
          <div class="progress-label"><span>Question ${state.practiceIndex + 1} of ${total}</span><span>${Math.round(progress)}%</span></div>
          <div class="progress-bar"><div class="progress-fill ${bossRound ? 'hot' : ''}" style="width:${progress}%"></div></div>
        </div>
        <div class="card">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px">
            <span class="topic-pill">${question.chapter}</span>
            <span class="topic-pill">${question.topic}</span>
            <span class="topic-pill">${question.type}</span>
            ${filterPill}
            ${bossRound ? '<span class="topic-pill boss-tag">Boss round</span>' : ''}
            ${weakCount >= 2 ? `<span class="weak-indicator">Weak topic: ${weakCount} misses</span>` : ''}
          </div>
          <h2 style="font-size:1.15rem">${question.q}</h2>
          <div class="choices">
            ${question.choices.map((choice, index) => {
              const result = state.practiceAnswered ? state.practiceResults[state.practiceResults.length - 1] : null;
              let cls = 'choice';
              if (result && result.q.q === question.q) {
                if (index === question.answer) cls += ' correct';
                else if (index === result.chosen && !result.isRight) cls += ' wrong';
              }
              return `<button class="${cls}" onclick="submitPractice(${index})" ${state.practiceAnswered ? 'disabled' : ''}><strong style="margin-right:8px;opacity:0.55">${String.fromCharCode(65 + index)}.</strong>${choice}</button>`;
            }).join('')}
          </div>
          ${state.practiceAnswered ? `
            <div class="explanation ${state.practiceResults[state.practiceResults.length - 1].isRight ? '' : 'wrong-exp'} show">
              <div class="explanation-label">${state.practiceResults[state.practiceResults.length - 1].isRight ? 'Correct' : 'Incorrect'}</div>
              <p>${question.explain}</p>
            </div>
            <div class="btn-row">
              <button class="btn btn-primary" onclick="nextPracticeQuestion()">${state.practiceIndex < total - 1 ? 'Next Question →' : 'See Results →'}</button>
            </div>` : ''}
          ${!state.practiceAnswered && state.practiceRerollsLeft > 0 ? `
            <div class="btn-row" style="margin-top:16px">
              <button class="btn btn-secondary" onclick="rerollPracticeQuestion()">Reroll Question (${state.practiceRerollsLeft} left)</button>
            </div>` : ''}
        </div>`;
    }

    function submitPractice(choiceIndex) {
      if (state.practiceAnswered) return;

      const question = state.practiceQueue[state.practiceIndex];
      const isRight = choiceIndex === question.answer;
      const elapsedMs = Date.now() - state.questionStartedAt;
      const bossRound = isBossRound(state.practiceIndex);
      state.practiceAnswered = true;
      state.selectedChoice = choiceIndex;
      emitSoundHook('answer-submit', { soundCue: 'answer-submit', result: isRight ? 'correct' : 'incorrect', mode: 'practice' });
      const { gainedXp, rankPromo } = applyAnswerOutcome({ isRight, mode: 'practice', elapsedMs, bossRound });
      state.practiceResults.push({ q: question, chosen: choiceIndex, isRight, gainedXp, elapsedMs, bossRound, rankPromo });
      if (bossRound && isRight) emitSoundHook('boss-clear', { soundCue: 'boss-clear', mode: 'practice' });

      if (!isRight) {
        state.weakTopics[question.topic] = (state.weakTopics[question.topic] || 0) + 1;
        saveWeakTopics();

        const key = question.q;
        const rematchBank = getRankBenefits().rematchBank;
        if (state.weakTopics[question.topic] >= 2 && !state.practiceRequeues[key]) {
          for (let i = 0; i < rematchBank; i += 1) {
            state.practiceDeferred.push(question);
          }
          state.practiceRequeues[key] = true;
        }
      }

      renderPractice();
    }

    function nextPracticeQuestion() {
      state.practiceIndex += 1;
      state.practiceAnswered = false;
      state.selectedChoice = null;
      state.rewardBursts = [];
      state.rankPromoToast = null;
      state.promoFlashKey = '';
      state.questionStartedAt = Date.now();
      renderPractice();
      scrollTop();
    }

    function rerollPracticeQuestion() {
      if (state.practiceAnswered || state.practiceRerollsLeft <= 0) return;
      const question = state.practiceQueue[state.practiceIndex];
      state.practiceRerollsLeft -= 1;
      state.practiceDeferred.push(question);
      state.rewardBursts = ['Question rerolled'];
      state.rankPromoToast = null;
      state.promoFlashKey = '';
      state.practiceIndex += 1;
      state.questionStartedAt = Date.now();
      renderPractice();
      scrollTop();
    }

    function renderPracticeResults() {
      const total = state.practiceResults.length;
      const correct = state.practiceResults.filter((result) => result.isRight).length;
      const percent = total ? Math.round((correct / total) * 100) : 0;
      const weakTopics = getWeakTopics();
      const level = getLevelInfo();
      const topicButtons = weakTopics.slice(0, 3).map(([topic, wrong]) => `
        <button class="btn btn-secondary" onclick="startPractice(${JSON.stringify(topic)})">Drill ${topic} (${wrong})</button>`).join('');

      document.getElementById('main').innerHTML = `
        <div class="card" style="text-align:center">
          <div class="card-label">Practice complete</div>
          <h2>Practice session finished</h2>
          <div class="score-badge" style="margin:20px auto 8px">
            <div class="score-num">${correct}/${total}</div>
            <div class="score-label">${percent}% correct</div>
          </div>
          <p>Session XP gained: <strong style="color:var(--accent2)">+${state.sessionXp}</strong> · Current rank: <strong>${level.tier.name}</strong></p>
          <p>${level.nextTier ? `${level.xpToNext} XP to ${level.nextTier.name}` : 'All visible rank rewards unlocked.'}</p>
          <p>${weakTopics.length ? 'Repeated misses were flagged. Review those topics before the mock exam.' : 'No topic has hit the weak-topic threshold. You can move straight into the mock exam.'}</p>
          ${weakTopics.length ? `
            <div class="analogy" style="margin-top:18px;text-align:left">
              <div class="analogy-label">Weak topics</div>
              ${weakTopics.map(([topic, wrong]) => `<p style="margin-bottom:6px">${topic}: ${wrong} misses</p>`).join('')}
            </div>` : ''}
          <div class="btn-row" style="justify-content:center">
            ${topicButtons}
            <button class="btn btn-secondary" onclick="startPractice()">Practice All Again</button>
            <button class="btn btn-primary" onclick="goMode('exam')">Take Mock Exam →</button>
          </div>
        </div>`;
    }

    function startExam(bypassQueue = false) {
      if (!bypassQueue) {
        openQueuePop('exam');
        return;
      }
      const questions = getQuestions();
      if (!questions.length) {
        document.getElementById('main').innerHTML = `
          <div class="card">
            <div class="card-label">Mock exam</div>
            <h2>No exam questions are available</h2>
            <p>The active pack needs question content before an exam can run.</p>
            <div class="btn-row">
              <button class="btn btn-secondary" onclick="goMode('scope')">Open Study Packs</button>
              <button class="btn btn-primary" onclick="goHome()">Back Home</button>
            </div>
          </div>`;
        return;
      }

      clearExamTimer();
      state.mode = 'exam';
      state.examQuestions = shuffle(questions).slice(0, Math.min(EXAM_QUESTION_COUNT, questions.length));
      state.examIndex = 0;
      state.examAnswers = [];
      state.examAnswered = false;
      state.examTimeRemaining = EXAM_DURATION_SECONDS;
      state.sessionXp = 0;
      state.currentStreak = 0;
      state.rewardBursts = [];
      state.rankPromoToast = null;
      state.promoFlashKey = '';
      state.questionStartedAt = Date.now();
      state.profile.sessions += 1;
      saveProfile();
      setActiveTab(5);
      startExamTimer();
      renderExam();
      scrollTop();
    }

    function renderExam() {
      syncHeaderTitle();
      if (state.examIndex >= state.examQuestions.length) {
        renderExamResults(false);
        return;
      }

      const question = state.examQuestions[state.examIndex];
      const result = state.examAnswers[state.examIndex];
      const total = state.examQuestions.length;
      const progress = ((state.examIndex + 1) / total) * 100;
      const bossRound = isBossRound(state.examIndex);

      document.getElementById('main').innerHTML = `
        ${renderGameHud('Mock Exam')}
        <div class="progress-wrap">
          <div class="progress-label">
            <span>Question ${state.examIndex + 1} of ${total}</span>
            <span>${Math.round(progress)}%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill ${bossRound ? 'hot' : ''}" style="width:${progress}%"></div></div>
        </div>
        <div class="exam-layout">
          <div class="exam-main">
            <div class="card">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px">
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                  <span class="topic-pill">${question.chapter}</span>
                  <span class="topic-pill">${question.topic}</span>
                  <span class="topic-pill">${question.type}</span>
                  ${bossRound ? '<span class="topic-pill boss-tag">Boss round</span>' : ''}
                </div>
                <div class="topic-pill" style="color:${state.examTimeRemaining <= 300 ? 'var(--red)' : 'var(--accent)'}">Time left: ${formatTime(state.examTimeRemaining)}</div>
              </div>
              <h2 style="font-size:1.15rem">${question.q}</h2>
              <div class="choices">
                ${question.choices.map((choice, index) => {
                  let cls = 'choice';
                  if (result) {
                    if (index === question.answer) cls += ' correct';
                    else if (index === result.chosen && !result.isRight) cls += ' wrong';
                  }
                  return `<button class="${cls}" onclick="submitExam(${index})" ${result ? 'disabled' : ''}><strong style="margin-right:8px;opacity:0.55">${String.fromCharCode(65 + index)}.</strong>${choice}</button>`;
                }).join('')}
              </div>
              ${result ? `
                <div class="explanation ${result.isRight ? '' : 'wrong-exp'} show">
                  <div class="explanation-label">${result.isRight ? 'Correct' : 'Incorrect'}</div>
                  <p>${question.explain}</p>
                </div>
                <div class="btn-row">
                  <button class="btn ${state.examIndex < total - 1 ? 'btn-primary' : 'btn-success'}" onclick="nextExamQuestion()">${state.examIndex < total - 1 ? 'Next →' : 'Finish Exam'}</button>
                </div>` : ''}
            </div>
          </div>
          ${buildFormulaSheet()}
        </div>`;
    }

    function submitExam(choiceIndex) {
      if (state.examAnswers[state.examIndex]) return;

      const question = state.examQuestions[state.examIndex];
      const isRight = choiceIndex === question.answer;
      const elapsedMs = Date.now() - state.questionStartedAt;
      const bossRound = isBossRound(state.examIndex);
      emitSoundHook('answer-submit', { soundCue: 'answer-submit', result: isRight ? 'correct' : 'incorrect', mode: 'exam' });
      const { gainedXp, rankPromo } = applyAnswerOutcome({ isRight, mode: 'exam', elapsedMs, bossRound });
      state.examAnswers[state.examIndex] = {
        q: question,
        chosen: choiceIndex,
        correct: question.answer,
        isRight,
        gainedXp,
        rankPromo,
      };
      if (bossRound && isRight) emitSoundHook('boss-clear', { soundCue: 'boss-clear', mode: 'exam' });

      if (!isRight) {
        state.weakTopics[question.topic] = (state.weakTopics[question.topic] || 0) + 1;
        saveWeakTopics();
      }

      state.examAnswered = true;
      renderExam();
    }

    function nextExamQuestion() {
      state.examIndex += 1;
      state.examAnswered = false;
      state.rewardBursts = [];
      state.rankPromoToast = null;
      state.promoFlashKey = '';
      state.questionStartedAt = Date.now();
      renderExam();
      scrollTop();
    }

    function renderExamResults(timedOut = false) {
      clearExamTimer();

      const answers = state.examQuestions.map((question, index) => {
        return state.examAnswers[index] || {
          q: question,
          chosen: null,
          correct: question.answer,
          isRight: false,
          unanswered: true,
        };
      });

      const total = answers.length;
      const correct = answers.filter((answer) => answer.isRight).length;
      const percent = total ? Math.round((correct / total) * 100) : 0;
      const unanswered = answers.filter((answer) => answer.unanswered).length;
      const grade = percent >= 90 ? 'A' : percent >= 80 ? 'B' : percent >= 70 ? 'C' : percent >= 60 ? 'D' : 'F';
      const topicStats = getTopicStats(answers);
      const earnedXp = answers.reduce((sum, answer) => sum + (answer.gainedXp || 0), 0);
      const level = getLevelInfo();
      const message = percent >= 80
        ? 'Strong exam-level performance. Review any misses and you are in good shape.'
        : percent >= 60
          ? 'Passing range, but there are still gaps worth drilling before test day.'
          : 'This needs another pass through Learn and Practice before relying on the mock score.';

      if (percent >= 80) unlockAchievement('exam_80');
      if (percent === 100) unlockAchievement('exam_100');

      document.getElementById('main').innerHTML = `
        <div class="card">
          <div class="card-label">Mock exam results</div>
          <h2>${timedOut ? 'Time expired' : 'Exam complete'}</h2>
          <div class="score-badge">
            <div class="score-num">${correct}/${total}</div>
            <div class="score-label">${percent}% · Grade ${grade}</div>
          </div>
          <p>Exam XP earned: <strong style="color:var(--accent2)">+${earnedXp}</strong></p>
          <p>Current rank: <strong>${level.tier.name}</strong>${level.nextTier ? ` · ${level.xpToNext} XP to ${level.nextTier.name}` : ' · Apex rank secured'}</p>
          <p>${message}</p>
          <p>${unanswered ? `${unanswered} question${unanswered === 1 ? '' : 's'} were left unanswered when the exam ended.` : `You completed all ${total} questions within ${formatTime(EXAM_DURATION_SECONDS - state.examTimeRemaining)}.`}</p>
          ${topicStats.length ? `
            <div class="card" style="margin-top:16px;background:var(--surface2)">
              <div class="card-label">Topic breakdown</div>
              ${topicStats.map((stat) => `<p>${stat.topic}: ${stat.correct}/${stat.total} correct</p>`).join('')}
            </div>` : ''}
          <div class="btn-row">
            <button class="btn btn-secondary" onclick="startExam()">Retake Exam</button>
            <button class="btn btn-secondary" onclick="startPractice()">Practice All</button>
            <button class="btn btn-primary" onclick="goHome()">Back Home</button>
          </div>
        </div>
        <div class="card" style="margin-top:16px">
          <div class="card-label">Full review</div>
          <h2 style="font-size:1.05rem">Every exam question</h2>
          ${answers.map((answer, index) => `
            <div style="padding:14px 0;border-bottom:1px solid var(--border)">
              <div style="display:flex;gap:10px;align-items:flex-start">
                <div style="font-size:1.05rem;color:${answer.isRight ? 'var(--green)' : 'var(--red)'}">${answer.isRight ? '✓' : '✕'}</div>
                <div>
                  <p style="color:var(--text);margin-bottom:6px"><strong>Q${index + 1}.</strong> ${answer.q.q}</p>
                  <p>${answer.unanswered ? 'No answer submitted.' : `Your answer: ${answer.q.choices[answer.chosen]}`}</p>
                  ${!answer.isRight ? `<p style="color:var(--green)">Correct answer: ${answer.q.choices[answer.correct]}</p>` : ''}
                  <p>${answer.q.explain}</p>
                </div>
              </div>
            </div>`).join('')}
        </div>`;
    }

    initSoundHooks();
    syncHeaderTitle();
    renderHome();
    renderQueuePop();
  </script>
</body>
</html>
